// ── WAV BOUNCE ─────────────────────────────────────────────────────
async function bounceWav() {
  const bpm = project.tempo;
  // Calculate total duration
  let totalBars = 0;
  for (const id of project.sectionOrder) totalBars += (project.sections[id]?.lengthBars||2);
  const totalBeats = totalBars * 4;
  const totalSecs  = totalBeats * 60 / bpm + 1.5; // 1.5s tail

  setStatus('Bouncing… this may take a moment');
  const AC = window.OfflineAudioContext || window.webkitOfflineAudioContext;
  const oCtx = new AC(2, Math.ceil(totalSecs * 44100), 44100);

  // Recreate master chain in offline context
  const oNoise = createNoiseBuffer(oCtx);
  const oReverb = oCtx.createConvolver(); oReverb.buffer = buildReverbIR(oCtx, 2);
  const oDelay  = oCtx.createDelay(2); oDelay.delayTime.value = 0.375;
  const oDlyFB  = oCtx.createGain(); oDlyFB.gain.value = 0.35;
  oDelay.connect(oDlyFB); oDlyFB.connect(oDelay);
  const oRvRet  = oCtx.createGain(); oRvRet.gain.value = 0.5; oReverb.connect(oRvRet);
  const oDlRet  = oCtx.createGain(); oDlRet.gain.value = 0.4; oDelay.connect(oDlRet);
  const oComp   = oCtx.createDynamicsCompressor();
  oComp.threshold.value=-18; oComp.ratio.value=6; oComp.knee.value=8;
  const oLim    = oCtx.createDynamicsCompressor();
  oLim.threshold.value=-3; oLim.ratio.value=20; oLim.knee.value=0; oLim.attack.value=0.001; oLim.release.value=0.05;
  const oBus    = oCtx.createGain(); oBus.gain.value = project.masterFx.masterVolume;
  oRvRet.connect(oComp); oDlRet.connect(oComp); oBus.connect(oComp);
  oComp.connect(oLim); oLim.connect(oCtx.destination);

  // Schedule all sections
  let tOffset = 0;
  const savedCtx = audioCtx, savedNoise = noiseBuffer, savedBus = masterBus, savedRev = sharedReverb, savedDly = sharedDelay;
  audioCtx = oCtx; noiseBuffer = oNoise; masterBus = oBus; sharedReverb = oReverb; sharedDelay = oDelay;

  for (const secId of project.sectionOrder) {
    const sec = project.sections[secId];
    if (!sec) continue;
    const secLenSecs = sec.lengthBars * 4 * 60 / bpm;
    for (const track of Object.values(sec.tracks)) {
      if (track.muted) continue;
      const tGain = oCtx.createGain(); tGain.gain.value = track.volume;
      const tDry  = oCtx.createGain(); tDry.connect(oBus);
      const tRv   = oCtx.createGain(); tRv.gain.value = track.reverbSend * track.effects.reverbMix; tRv.connect(oReverb);
      tGain.connect(tDry); tGain.connect(tRv);
      for (const note of track.notes) {
        const t = tOffset + note.beatStart * 60 / bpm;
        playNote(track.instrument, midiToHz(note.midiNote), note.duration*60/bpm, t, tGain);
      }
    }
    tOffset += secLenSecs;
  }

  audioCtx = savedCtx; noiseBuffer = savedNoise; masterBus = savedBus; sharedReverb = savedReverb; sharedDelay = savedDly;

  const rendered = await oCtx.startRendering();
  const blob = audioBufferToWav(rendered);
  const a = document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=(project.title||'bounce')+'.wav'; a.click();
  setStatus('WAV exported');
}

function audioBufferToWav(buf) {
  const nCh=buf.numberOfChannels, sr=buf.sampleRate;
  const chs=[]; for(let i=0;i<nCh;i++) chs.push(buf.getChannelData(i));
  const pcm=new Float32Array(buf.length*nCh);
  for(let i=0;i<buf.length;i++) for(let c=0;c<nCh;c++) pcm[i*nCh+c]=chs[c][i];
  const dataLen=pcm.length*2, ab=new ArrayBuffer(44+dataLen), v=new DataView(ab);
  const ws=(o,s)=>{for(let i=0;i<s.length;i++)v.setUint8(o+i,s.charCodeAt(i));};
  ws(0,'RIFF'); v.setUint32(4,36+dataLen,true); ws(8,'WAVE'); ws(12,'fmt ');
  v.setUint32(16,16,true); v.setUint16(20,1,true); v.setUint16(22,nCh,true);
  v.setUint32(24,sr,true); v.setUint32(28,sr*nCh*2,true); v.setUint16(32,nCh*2,true);
  v.setUint16(34,16,true); ws(36,'data'); v.setUint32(40,dataLen,true);
  let o=44; for(let i=0;i<pcm.length;i++){const s=Math.max(-1,Math.min(1,pcm[i])); v.setInt16(o,s<0?s*0x8000:s*0x7FFF,true); o+=2;}
  return new Blob([ab],{type:'audio/wav'});
}

// ── DEMO PROJECT ───────────────────────────────────────────────────
// B minor pentatonic: B(59), D(62), E(64), F#(66), A(69), B(71)
// Bass drone: B2=47, B3=59
function makeDemoProject() {
  const bellNotes = [
    // Bar 1
    [0,    71, 0.5], [0.5,  69, 0.5], [1,   66, 0.5], [1.5, 64, 0.5],
    [2,    62, 1.0], [3,    64, 0.5], [3.5, 66, 0.5],
    // Bar 2
    [4,    69, 1.0], [5,    71, 0.5], [5.5, 69, 0.5],
    [6,    66, 1.0], [7,    64, 1.0],
  ];
  const bellNotes2 = [
    // Bar 1 — slightly different
    [0, 64, 0.5],[0.5,66,0.5],[1,69,1],[2,71,0.5],[2.5,69,0.5],[3,66,1],
    // Bar 2
    [4,64,0.5],[4.5,62,0.5],[5,59,1],[6,62,1],[7,64,1],
  ];
  const bassNotes = [
    [0,47,2],[2,47,2],[4,47,2],[6,47,2], // B2 whole section
  ];
  const pluckNotes = [
    [0,64,1],[1,62,1],[2,59,1],[3,57,1],[4,59,2],[6,62,1],[7,64,1],
  ];
  const mkNotes = arr => arr.map(([bs,mn,dur]) => makeNote(bs,mn,dur,100));

  const bell1Id = uid(), bass1Id = uid(), bell2Id = uid(), bass2Id = uid(), pluckId = uid(), bellCId = uid();

  const secA = {
    id:'A', label:'A', lengthBars:2,
    tracks: {
      [bell1Id]: {
        id:bell1Id, label:'Bell Lead', instrument:'bell', color:'#7c6aff',
        volume:0.8, muted:false, soloed:false, reverbSend:0.35,
        notes: mkNotes(bellNotes), effects:DEFAULT_FX()
      },
    }
  };
  const secB = {
    id:'B', label:'B', lengthBars:2,
    tracks: {
      [bell2Id]: {
        id:bell2Id, label:'Bell Lead', instrument:'bell', color:'#7c6aff',
        volume:0.75, muted:false, soloed:false, reverbSend:0.35,
        notes: mkNotes(bellNotes2), effects:DEFAULT_FX()
      },
      [bass1Id]: {
        id:bass1Id, label:'Bass Drone', instrument:'bass', color:'#4fc3f7',
        volume:0.7, muted:false, soloed:false, reverbSend:0.1,
        notes: mkNotes(bassNotes), effects:{...DEFAULT_FX(), ...INST_FILTER.bass}
      },
    }
  };

  // Drum notes for section C (kick=36 midi, snare=38, hat=42 — but instrument handles synthesis)
  const kickNotes   = [0,1,2,3,4,5,6,7].map(b=>makeNote(b,36,0.25,100));
  const snareNotes  = [1,3,5,7].map(b=>makeNote(b,38,0.25,90));
  const hatNotes    = [0,0.5,1,1.5,2,2.5,3,3.5,4,4.5,5,5.5,6,6.5,7,7.5].map(b=>makeNote(b,42,0.125,70));
  const kickId=uid(), snareId=uid(), hatId=uid();

  const secC = {
    id:'C', label:'C', lengthBars:2,
    tracks: {
      [bellCId]: {
        id:bellCId, label:'Bell Lead', instrument:'bell', color:'#7c6aff',
        volume:0.7, muted:false, soloed:false, reverbSend:0.3,
        notes: mkNotes(bellNotes), effects:DEFAULT_FX()
      },
      [bass2Id]: {
        id:bass2Id, label:'Bass Drone', instrument:'bass', color:'#4fc3f7',
        volume:0.65, muted:false, soloed:false, reverbSend:0.1,
        notes: mkNotes(bassNotes), effects:{...DEFAULT_FX(), ...INST_FILTER.bass}
      },
      [pluckId]: {
        id:pluckId, label:'Pluck', instrument:'pluck', color:'#81c784',
        volume:0.7, muted:false, soloed:false, reverbSend:0.2,
        notes: mkNotes(pluckNotes), effects:DEFAULT_FX()
      },
      [kickId]: {
        id:kickId, label:'Kick', instrument:'kick', color:'#ff6b6b',
        volume:0.9, muted:false, soloed:false, reverbSend:0,
        notes: kickNotes, effects:{...DEFAULT_FX(), ...INST_FILTER.kick}
      },
      [snareId]: {
        id:snareId, label:'Snare', instrument:'snare', color:'#ffb74d',
        volume:0.8, muted:false, soloed:false, reverbSend:0.1,
        notes: snareNotes, effects:{...DEFAULT_FX(), ...INST_FILTER.snare}
      },
      [hatId]: {
        id:hatId, label:'Hat', instrument:'hat', color:'#f06292',
        volume:0.6, muted:false, soloed:false, reverbSend:0,
        notes: hatNotes, effects:{...DEFAULT_FX(), ...INST_FILTER.hat}
      },
    }
  };

  return {
    version:2, title:'B Minor Pentatonic', tempo:80,
    sectionOrder:['A','B','C'],
    sections:{ A:secA, B:secB, C:secC },
    masterFx: DEFAULT_MASTER_FX(),
  };
}

function loadDemo() {
  pushUndo();
  project = makeDemoProject();
  activeSectionId = 'A';
  if (audioCtx) rebuildEngines();
  renderTrackHeaders(); renderSectionUI();
  PR.scrollBeat = 0;
  // Scroll to note range (~MIDI 45-75)
  PR.scrollPitchPx = Math.max(0, (MIDI_MAX - 80) * PR.rowHeight - (PR.height - RULER_H) * 0.3);
  PR.gridDirty = true; PR.dirty = true; schedRedraw(); saveProject();
  setStatus('Demo loaded — B minor pentatonic at 80 BPM · Press Play');
}

// ── KEYBOARD SHORTCUTS ─────────────────────────────────────────────
document.addEventListener('keydown', async e => {
  if (e.target.tagName==='INPUT'||e.target.tagName==='SELECT'||e.target.tagName==='TEXTAREA') return;
  if (e.ctrlKey||e.metaKey) {
    if (e.key==='z') { e.preventDefault(); performUndo(); }
    return;
  }
  switch(e.key) {
    case ' ':
      e.preventDefault();
      if (isPlaying) { stopPlayback(); }
      else { await ensureAudio(); if (!audioCtx) break; startPlayback(0); }
      break;
    case 'd': case 'D': setTool('pencil'); break;
    case 's': case 'S': setTool('pointer'); break;
    case 'e': case 'E': setTool('eraser'); break;
    case '+': case '=': zoomIn(); break;
    case '-': case '_': zoomOut(); break;
  }
});

function setTool(name) {
  activeTool = name;
  ['pencil','pointer','eraser'].forEach(t => {
    document.getElementById('tool-'+t).classList.toggle('active', t===name);
  });
  noteCanvas.style.cursor = name==='eraser'?'cell':name==='pointer'?'default':'crosshair';
}

// ── MASTER CONTROLS ────────────────────────────────────────────────
function hissLabel(v) {
  if (v <= 0.001) return 'off';
  if (v <= 0.006) return 'low';
  if (v <= 0.013) return 'mid';
  return 'high';
}

function syncMasterStrip() {
  const fx = project.masterFx;
  document.getElementById('mc-vol').value  = fx.masterVolume;
  document.getElementById('mc-vol-val').textContent = fx.masterVolume.toFixed(2);
  document.getElementById('mc-bass').value = fx.bassGain;
  document.getElementById('mc-bass-val').textContent = (fx.bassGain >= 0 ? '+' : '') + fx.bassGain + ' dB';
  document.getElementById('mc-comp').value = fx.compThreshold;
  document.getElementById('mc-comp-val').textContent = fx.compThreshold;
  document.getElementById('mc-hiss').value = fx.hissLevel;
  document.getElementById('mc-hiss-val').textContent = hissLabel(fx.hissLevel);
}


document.getElementById('mc-vol').addEventListener('input', async e => {
  const v = +e.target.value;
  document.getElementById('mc-vol-val').textContent = v.toFixed(2);
  project.masterFx.masterVolume = v;
  await ensureAudio();
  if (masterBus) masterBus.gain.setTargetAtTime(v, audioCtx.currentTime, 0.02);
  saveProject();
});
document.getElementById('mc-bass').addEventListener('input', async e => {
  const v = +e.target.value;
  document.getElementById('mc-bass-val').textContent = (v >= 0 ? '+' : '') + v + ' dB';
  project.masterFx.bassGain = v;
  await ensureAudio();
  if (bassBoost) bassBoost.gain.setTargetAtTime(v, audioCtx.currentTime, 0.02);
  saveProject();
});
document.getElementById('mc-comp').addEventListener('input', async e => {
  const v = +e.target.value;
  document.getElementById('mc-comp-val').textContent = v;
  project.masterFx.compThreshold = v;
  await ensureAudio();
  if (compressor) compressor.threshold.setTargetAtTime(v, audioCtx.currentTime, 0.02);
  saveProject();
});
document.getElementById('mc-hiss').addEventListener('input', async e => {
  const v = +e.target.value;
  document.getElementById('mc-hiss-val').textContent = hissLabel(v);
  project.masterFx.hissLevel = v;
  await ensureAudio();
  // Only update live gain if currently playing (otherwise it stays silent until next play)
  if (hissGainNode && isPlaying) hissGainNode.gain.setTargetAtTime(v, audioCtx.currentTime, 0.3);
  saveProject();
});

// ── TRANSPORT WIRING ───────────────────────────────────────────────
document.getElementById('btn-play').addEventListener('click', async () => {
  await ensureAudio();
  if (isPlaying) stopPlayback();
  else startPlayback(0);
});
document.getElementById('btn-stop').addEventListener('click', () => {
  stopPlayback();
  playStartBeat = 0;
  document.getElementById('playhead-time').textContent = '0:00';
  PR.dirty = true; schedRedraw();
});
document.getElementById('bpm-input').addEventListener('input', e => {
  project.tempo = clamp(+e.target.value||120, 20, 400);
  saveProject();
});
document.getElementById('quant-sel').addEventListener('change', e => {
  quantSnap = +e.target.value;
});
document.getElementById('btn-undo').addEventListener('click', performUndo);
document.getElementById('btn-export-midi').addEventListener('click', async () => { await ensureAudio(); exportMidi(); });
document.getElementById('btn-import-midi').addEventListener('click', () => document.getElementById('midi-file-input').click());
document.getElementById('midi-file-input').addEventListener('change', e => { if(e.target.files[0]) importMidiFile(e.target.files[0]); e.target.value=''; });
document.getElementById('btn-export-wav').addEventListener('click', async () => { await ensureAudio(); bounceWav(); });
document.getElementById('btn-load-demo').addEventListener('click', loadDemo);
document.getElementById('btn-reset').addEventListener('click', () => {
  if (confirm('Clear all saved state and start with a blank project?')) {
    localStorage.removeItem('daw-v2');
    project = makeProject();
    activeSectionId = 'A';
    if (audioCtx) rebuildEngines();
    renderTrackHeaders();
    renderSectionUI();
    syncMasterStrip();
    PR.scrollBeat=0; PR.gridDirty=true; PR.dirty=true; schedRedraw();
    setStatus('Reset — blank project');
  }
});
document.getElementById('btn-add-track').addEventListener('click', async () => { await ensureAudio(); addTrack(); });
document.getElementById('btn-add-section').addEventListener('click', addSection);

// ── INIT ───────────────────────────────────────────────────────────
function init() {
  if (!loadSaved()) {
    project = makeProject();
    activeSectionId = 'A';
  }
  document.getElementById('bpm-input').value = project.tempo;
  syncMasterStrip();

  renderTrackHeaders();
  renderSectionUI();

  // Initial piano roll scroll — center on MIDI ~60-72 range
  window.addEventListener('resize', () => { PR.gridDirty=true; PR.dirty=true; schedRedraw(); });
  // Wait a frame so layout is computed
  requestAnimationFrame(() => {
    resizeCanvases();
    PR.scrollPitchPx = Math.max(0, (MIDI_MAX - 80) * PR.rowHeight - (PR.height - RULER_H) * 0.35);
    PR.gridDirty=true; PR.dirty=true; schedRedraw();
  });
}

init();
</script>
