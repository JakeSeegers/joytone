<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>DAW</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:#111;color:#ccc;font:13px/1.4 'Segoe UI',system-ui,sans-serif}

/* ── LAYOUT ─────────────────────────────────────────────────────── */
#app{display:flex;flex-direction:column;height:100vh}

/* Transport */
#transport{
  display:flex;align-items:center;gap:8px;padding:6px 10px;
  background:#1a1a22;border-bottom:1px solid #333;flex-shrink:0;
  flex-wrap:wrap;min-height:42px
}
#transport .sep{width:1px;height:22px;background:#333;margin:0 2px}

/* Master controls strip */
#master-strip{
  display:flex;align-items:center;gap:12px;padding:4px 10px;
  background:#13131a;border-bottom:1px solid #252530;flex-shrink:0;
  flex-wrap:wrap;min-height:30px
}
#master-strip .mc-group{display:flex;align-items:center;gap:5px}
#master-strip label{font-size:10px;color:#666;white-space:nowrap}
#master-strip input[type=range]{width:72px;height:3px;accent-color:#5566cc;cursor:pointer}
#master-strip .mc-val{font-size:10px;color:#888;min-width:28px;text-align:right}
#fx-state-wrap{display:flex;align-items:center;gap:5px;flex-wrap:wrap}
#fx-state-buttons{display:flex;align-items:center;gap:4px;flex-wrap:wrap}
.fx-state-btn{padding:2px 7px;font-size:11px;border-color:#4a3f6a;background:#25203a;color:#cfc8ff}
.fx-state-btn:hover{background:#30284a}
.fx-state-btn.morphing{background:#4a3a7a;border-color:#8877cc;color:#fff}

/* Section strip */
#section-strip{
  display:flex;align-items:center;gap:6px;padding:4px 10px;
  background:#161620;border-bottom:1px solid #2a2a35;flex-shrink:0;
  min-height:34px
}
#section-strip .lbl{color:#666;font-size:11px;white-space:nowrap}
#section-tabs{display:flex;gap:4px}

/* Elemental strip */
#elemental-strip{
  display:flex;align-items:center;gap:6px;padding:4px 10px;
  background:#14141c;border-bottom:1px solid #2a2a35;flex-shrink:0;
  min-height:32px;flex-wrap:wrap
}
#elemental-strip .lbl{color:#666;font-size:11px;white-space:nowrap}
#elemental-buttons{display:flex;gap:4px;flex-wrap:wrap}
.el-btn{padding:2px 9px;font-size:11px;border:1px solid #444;border-radius:3px;background:#1e1e28;color:#ccc}
.el-btn:hover{background:#26263a}
.el-btn.active{background:#2d2d50;color:#fff;box-shadow:0 0 8px rgba(120,120,220,.4)}
#btn-add-drums{padding:2px 9px;font-size:11px;margin-left:auto}
#btn-elemental-auto{padding:2px 9px;font-size:11px}
#btn-elemental-auto.on{background:#3a2d5a;border-color:#8877cc;color:#e8e0ff}

/* DAW main area */
#daw-main{display:flex;flex:1;overflow:hidden;min-height:0}

/* Track headers */
#track-panel{
  width:210px;min-width:150px;flex-shrink:0;
  display:flex;flex-direction:column;
  background:#181820;border-right:1px solid #2a2a35;overflow:hidden
}
#track-panel-ruler{height:24px;background:#141418;border-bottom:1px solid #2a2a35;flex-shrink:0}
#track-list{flex:1;overflow-y:auto;overflow-x:hidden}
#track-list::-webkit-scrollbar{width:4px}
#track-list::-webkit-scrollbar-thumb{background:#333}
#btn-add-track{
  margin:6px;padding:5px 10px;background:#252535;border:1px dashed #444;
  border-radius:4px;color:#888;cursor:pointer;font-size:12px;text-align:center
}
#btn-add-track:hover{background:#2a2a3a;color:#aaa}

/* Piano roll area */
#roll-area{flex:1;display:flex;flex-direction:column;overflow:hidden;min-width:0}

/* Canvas container */
#canvas-wrap{
  position:relative;flex:1;overflow:hidden;min-height:0;
  background:#1e1e28;cursor:crosshair
}
#canvas-wrap canvas{position:absolute;top:0;left:0;display:block}
#grid-canvas{pointer-events:none}
#note-canvas{z-index:2}

/* Status bar */
#status-bar{
  display:flex;align-items:center;justify-content:space-between;
  padding:3px 10px;background:#111118;border-top:1px solid #222;
  flex-shrink:0;font-size:11px;color:#666;min-height:22px
}
#zoom-controls{display:flex;align-items:center;gap:4px}

/* ── BUTTONS ─────────────────────────────────────────────────────── */
button{
  padding:4px 10px;border:1px solid #383848;border-radius:4px;
  background:#252535;color:#bbb;cursor:pointer;font-size:12px;
  white-space:nowrap;transition:background .1s
}
button:hover{background:#2e2e42}
button:active{background:#333355}
button.active,button.on{background:#3d3d6e;border-color:#5555aa;color:#ddf}
button.danger:hover{background:#4a1a1a;border-color:#aa3333}

/* Transport specific */
#btn-play{border-color:#2a5a2a;background:#1e3e1e;color:#7f7}
#btn-play:hover{background:#253e25}
#btn-play.playing{background:#3a1e1e;border-color:#5a2a2a;color:#f77}
#btn-stop{border-color:#4a3a1a;background:#2e2414}
#btn-stop:hover{background:#3a2d18}

/* Tool buttons */
.tool-btn{padding:4px 8px;font-size:13px}
.tool-btn.active{background:#3d3d6e;border-color:#5555aa}

/* Section tabs */
.sec-tab{
  display:inline-flex;align-items:center;gap:5px;
  padding:3px 8px 3px 12px;border:1px solid #333;border-radius:3px;
  background:#1e1e28;cursor:pointer;font-size:12px;font-weight:600
}
.sec-tab.active{background:#2d2d50;border-color:#4444aa;color:#aaf}
.sec-tab.playing{box-shadow:0 0 0 1px #66dd88 inset,0 0 10px rgba(80,255,140,.35);border-color:#55aa66;color:#cfc}
.sec-tab.active.playing{background:#254a35;border-color:#66cc88;color:#dfffdf}
.sec-order-item{display:inline-flex;align-items:center;gap:2px;padding:1px 4px;border:1px solid #333;border-radius:3px;background:#1e1e28}
.sec-order-item.playing{background:#244632;border-color:#66cc88;color:#dfffdf;box-shadow:0 0 9px rgba(80,255,140,.28)}
.sec-order-name{padding:0 3px;cursor:pointer;font-weight:600}
.sec-order-move,.sec-order-remove{padding:0 3px;border:none;background:transparent;color:#777;font-size:10px;line-height:1;min-width:0}
.sec-order-move:hover{color:#cdf;background:#2e2e42}
.sec-order-remove:hover{color:#f88;background:rgba(255,80,80,.15)}
.sec-tab:hover:not(.active){background:#252535}
.sec-del{
  font-size:14px;line-height:1;color:#666;padding:0 1px;
  border-radius:2px;cursor:pointer
}
.sec-del:hover{color:#f88;background:rgba(255,80,80,.15)}

/* ── TRACK HEADER CARD ───────────────────────────────────────────── */
.track-card{
  border-bottom:1px solid #222230;padding:4px 6px;
  display:flex;flex-direction:column;gap:3px;cursor:default
}
.track-card.selected{background:#1e1e30}
.track-row1{display:flex;align-items:center;gap:4px}
.track-color-swatch{width:10px;height:28px;border-radius:2px;flex-shrink:0;cursor:pointer}
.track-name{
  flex:1;background:transparent;border:none;color:#ccc;font-size:12px;
  padding:2px 3px;border-radius:2px;min-width:0
}
.track-name:focus{background:#252535;outline:1px solid #444;color:#eee}
.track-btn{
  padding:2px 5px;font-size:10px;border-radius:3px;line-height:1.4;min-width:28px
}
.track-btn.muted{background:#4a2020;border-color:#883333;color:#f88}
.track-btn.soloed{background:#2a4a1a;border-color:#44aa22;color:#8f8}
.track-row2{display:flex;align-items:center;gap:4px}
.track-inst-sel{
  flex:1;background:#1e1e28;border:1px solid #333;color:#bbb;
  font-size:11px;padding:2px 4px;border-radius:3px;min-width:0
}
.track-inst-sel:focus{outline:1px solid #555}
.vol-slider{
  width:56px;height:3px;accent-color:#5566cc;cursor:pointer
}
.track-row3{display:flex;align-items:center;gap:4px}
.rev-slider{width:50px;height:3px;accent-color:#336655;cursor:pointer}
.pan-slider{width:46px;height:3px;accent-color:#aa6655;cursor:pointer}
.fx-toggle{font-size:10px;padding:2px 5px;border-radius:3px}
.sample-row{font-size:10px;color:#777}
.sample-load{font-size:10px;padding:2px 6px;border-radius:3px}
.sample-sustain.on{background:#3d3d6e;border-color:#5555aa;color:#ddf}
.sample-auto{font-size:10px;padding:2px 6px;border-radius:3px}
.sample-root{width:42px!important;padding:1px 3px!important;font-size:10px!important}
.sample-name{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:#888}

/* Per-track effects panel */
.track-fx{
  padding:5px 6px;background:#141420;border-bottom:1px solid #1a1a28;
  display:none;flex-direction:column;gap:4px
}
.track-fx.open{display:flex}
.fx-row{display:flex;align-items:center;gap:5px;font-size:10px;color:#888}
.fx-row label{width:66px;flex-shrink:0}
.fx-slider{flex:1;height:3px;accent-color:#4455bb;cursor:pointer}
.fx-row select{flex:1;min-width:0;font-size:10px;padding:1px 4px}

/* ── FORM INPUTS ─────────────────────────────────────────────────── */
select{
  background:#1e1e28;border:1px solid #333;color:#bbb;
  padding:3px 6px;border-radius:4px;font-size:12px;cursor:pointer
}
select:focus{outline:1px solid #555}
input[type=number]{
  background:#1e1e28;border:1px solid #333;color:#ccc;
  padding:3px 6px;border-radius:4px;font-size:12px;width:60px;text-align:center
}
input[type=number]:focus{outline:1px solid #555}
input[type=range]{cursor:pointer}

/* ── DRAG OVERLAY ────────────────────────────────────────────────── */
#drop-overlay{
  display:none;position:fixed;inset:0;background:rgba(0,0,80,.7);
  z-index:999;align-items:center;justify-content:center;
  font-size:28px;color:#aaf;border:4px dashed #446;
  pointer-events:none
}
#drop-overlay.visible{display:flex}

/* ── LIBRARY MODAL ───────────────────────────────────────────────── */
#lib-modal{
  display:none;position:fixed;inset:0;background:rgba(0,0,0,.82);
  z-index:1000;align-items:flex-start;justify-content:center;padding-top:40px
}
#lib-modal.open{display:flex}
#lib-box{
  background:#1e1e2e;border:1px solid #444;border-radius:8px;
  width:700px;max-width:96vw;max-height:80vh;display:flex;flex-direction:column;
  box-shadow:0 8px 40px #000a
}
#lib-header{
  display:flex;align-items:center;gap:8px;padding:10px 14px;
  border-bottom:1px solid #333;flex-shrink:0
}
#lib-header h3{margin:0;font-size:14px;color:#cdf;flex:1}
#lib-tabs{display:flex;gap:4px}
.lib-tab{
  padding:4px 14px;border:1px solid #555;border-radius:4px;
  background:#2a2a3e;color:#aaa;cursor:pointer;font-size:12px
}
.lib-tab.active{background:#4455aa;color:#fff;border-color:#6677cc}
#lib-filters{
  padding:8px 14px;display:flex;gap:8px;flex-wrap:wrap;flex-shrink:0;
  border-bottom:1px solid #2a2a3a
}
#lib-filters select,#lib-filters input{
  background:#252535;color:#ccc;border:1px solid #444;border-radius:4px;
  padding:3px 6px;font-size:12px
}
#lib-filters input{flex:1;min-width:120px}
#lib-list{overflow-y:auto;flex:1;padding:6px 0}
.lib-row{
  display:flex;align-items:center;gap:8px;padding:5px 14px;
  border-bottom:1px solid #1a1a28;cursor:pointer
}
.lib-row:hover{background:#2a2a40}
.lib-row-info{flex:1;min-width:0}
.lib-row-title{font-size:12px;color:#ddd;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lib-row-meta{font-size:10px;color:#888;margin-top:1px}
.lib-row-load{
  padding:3px 10px;background:#3a5a9a;border:none;border-radius:4px;
  color:#cdf;font-size:11px;cursor:pointer;flex-shrink:0
}
.lib-row-load:hover{background:#4a6abc}
#lib-status{padding:8px 14px;font-size:11px;color:#888;flex-shrink:0;text-align:center}
</style>
</head>
<body>
<div id="app">

  <!-- ── TRANSPORT ────────────────────────────────────────────────── -->
  <div id="transport">
    <button id="btn-play" title="Play / Pause (Space)">▶ Play</button>
    <button id="btn-stop" title="Stop">■</button>
    <div class="sep"></div>
    <label style="display:flex;align-items:center;gap:4px;font-size:12px;color:#888">
      BPM <input type="number" id="bpm-input" value="120" min="20" max="400" step="1">
    </label>
    <span id="playhead-time" style="font-size:11px;color:#666;min-width:40px">0:00</span>
    <div class="sep"></div>
    <!-- Tools -->
    <button class="tool-btn active" id="tool-pencil" title="Draw notes (D)">✏</button>
    <button class="tool-btn" id="tool-pointer" title="Select / Move (S)">⟡</button>
    <button class="tool-btn" id="tool-eraser" title="Erase (E)">⌫</button>
    <div class="sep"></div>
    <!-- Quantize -->
    <label style="font-size:11px;color:#888">Q:</label>
    <select id="quant-sel" title="Quantization">
      <option value="1">1/4</option>
      <option value="0.5" selected>1/8</option>
      <option value="0.25">1/16</option>
      <option value="0.125">1/32</option>
      <option value="0">Free</option>
    </select>
    <div class="sep"></div>
    <button id="btn-undo" title="Undo (Ctrl+Z)" disabled>↩ Undo</button>
    <div class="sep"></div>
    <button id="btn-export-midi" title="Export MIDI">⬇ MIDI</button>
    <button id="btn-import-midi" title="Import MIDI file">⬆ MIDI</button>
    <input type="file" id="midi-file-input" accept=".mid,.midi" style="display:none">
    <button id="btn-export-wav" title="Bounce to WAV">⬇ WAV</button>
    <div class="sep"></div>
    <button id="btn-library" title="Browse MIDI library">📚 Library</button>
    <button id="btn-load-demo" title="Load demo song">★ Demo</button>
    <button id="btn-reset" title="Clear saved state and start fresh" style="color:#f88">⊘ Reset</button>
  </div>

  <!-- ── MASTER CONTROLS ─────────────────────────────────────────── -->
  <div id="master-strip">
    <div class="mc-group">
      <label>VOL</label>
      <input type="range" id="mc-vol" min="0" max="1" step="0.01" value="0.7">
      <span class="mc-val" id="mc-vol-val">0.7</span>
    </div>
    <div class="mc-group">
      <label>BASS</label>
      <input type="range" id="mc-bass" min="-12" max="12" step="0.5" value="0">
      <span class="mc-val" id="mc-bass-val">0 dB</span>
    </div>
    <div class="mc-group">
      <label>COMP</label>
      <input type="range" id="mc-comp" min="-40" max="0" step="1" value="-18">
      <span class="mc-val" id="mc-comp-val">−18</span>
    </div>
    <div class="mc-group">
      <label>HISS</label>
      <input type="range" id="mc-hiss" min="0" max="0.025" step="0.001" value="0.004">
      <span class="mc-val" id="mc-hiss-val">low</span>
    </div>
    <div class="sep"></div>
    <div class="mc-group" id="fx-state-wrap">
      <button id="btn-save-fx-state" title="Save the current master and per-track settings as a new recallable FX state.">+ Save State</button>
      <button id="btn-download-fx-states" title="Download all saved FX states as a JSON preset bank.">⬇ FX Set</button>
      <button id="btn-upload-fx-states" title="Upload a JSON FX preset bank. This replaces the current FX state buttons.">⬆ FX Set</button>
      <input type="file" id="fx-states-file-input" accept=".json,application/json" style="display:none">
      <div id="fx-state-buttons"></div>
    </div>
  </div>

  <!-- ── SECTION STRIP ────────────────────────────────────────────── -->
  <div id="section-strip">
    <span class="lbl">Section:</span>
    <div id="section-tabs"><!-- filled by JS --></div>
    <button id="btn-add-section" style="padding:2px 8px;font-size:11px" title="Create a new blank section">+ Add</button>
    <button id="btn-dup-section" style="padding:2px 8px;font-size:11px" title="Duplicate the active section, including notes, FX settings, and loaded samples">⧉ Duplicate</button>
    <div class="sep"></div>
    <span class="lbl">Play&nbsp;order:</span>
    <div id="section-order" style="display:flex;gap:4px;align-items:center;font-size:11px;color:#aaa">
      <!-- filled by JS -->
    </div>
  </div>

  <!-- ── ELEMENTAL STRIP ──────────────────────────────────────────── -->
  <div id="elemental-strip">
    <span class="lbl" title="Pick an element to load &amp; loop a random matching chord progression. All 35 clips share key A so any order sounds good.">Elemental:</span>
    <div id="elemental-buttons"><!-- filled by JS --></div>
    <button id="btn-add-drums" title="Add the last loaded drums to the current sequence, keeping their previous mix/FX settings." disabled>🥁 Add Drums</button>
    <button id="btn-elemental-auto" title="Auto-shuffle: at each loop boundary, swap to another random clip from the current element filter.">🎲 Auto</button>
  </div>

  <!-- ── MAIN ─────────────────────────────────────────────────────── -->
  <div id="daw-main">

    <!-- Track headers -->
    <div id="track-panel">
      <div id="track-panel-ruler"></div>
      <div id="track-list"></div>
      <button id="btn-add-track">+ Add Track</button>
    </div>

    <!-- Piano roll -->
    <div id="roll-area">
      <div id="canvas-wrap">
        <canvas id="grid-canvas"></canvas>
        <canvas id="note-canvas"></canvas>
      </div>
    </div>

  </div>

  <!-- Status bar -->
  <div id="status-bar">
    <span id="status-msg">Drop a .mid file anywhere to import · Space = play/pause · D/S/E = draw/select/erase</span>
    <div id="zoom-controls">
      <button onclick="zoomOut()" style="padding:1px 7px;font-size:14px" title="Zoom out (-)">−</button>
      <span id="zoom-label" style="font-size:11px;width:70px;text-align:center">80 px/beat</span>
      <button onclick="zoomIn()" style="padding:1px 7px;font-size:14px" title="Zoom in (+)">+</button>
    </div>
  </div>

</div><!-- #app -->

<!-- MIDI drop overlay -->
<div id="drop-overlay">Drop MIDI file to import</div>

<!-- ── LIBRARY MODAL ──────────────────────────────────────────────── -->
<div id="lib-modal">
  <div id="lib-box">
    <div id="lib-header">
      <h3>📚 MIDI Library</h3>
      <div id="lib-tabs">
        <button class="lib-tab active" data-deck="chords">Chords</button>
        <button class="lib-tab" data-deck="drums">Drums</button>
      </div>
      <button id="lib-close" style="background:none;border:none;color:#888;font-size:18px;cursor:pointer;padding:0 4px">✕</button>
    </div>
    <div id="lib-filters">
      <!-- filled by JS per tab -->
    </div>
    <div id="lib-list">
      <!-- filled by JS -->
    </div>
    <div id="lib-status">Loading library…</div>
  </div>
</div>

<script>
'use strict';
// ═══════════════════════════════════════════════════════════════════
//  DAW — single-file browser DAW using Web Audio API
// ═══════════════════════════════════════════════════════════════════

// ── CONSTANTS ──────────────────────────────────────────────────────
const KEYS_WIDTH  = 52;   // px — piano keyboard sidebar
const RULER_H     = 24;   // px — time ruler height
const ROW_H       = 14;   // px default row height (one semitone)
const MIDI_MIN    = 21;   // A0
const MIDI_MAX    = 108;  // C8
const LOOKAHEAD   = 0.1;  // seconds scheduler looks ahead
const SCHED_MS    = 25;   // scheduler interval ms
const PPQ         = 480;  // pulses per quarter note

const INSTRUMENTS = [
  {id:'bell',    label:'Bell'},
  {id:'marimba', label:'Marimba'},
  {id:'pluck',   label:'Pluck'},
  {id:'bass',    label:'Bass Drone'},
  {id:'organ',   label:'Organ'},
  {id:'piano',   label:'Piano'},
  {id:'guitar',  label:'Guitar'},
  {id:'flute',   label:'Flute'},
  {id:'synth',   label:'Synth'},
  {id:'sample',  label:'Sample'},
  {id:'kick',    label:'Kick'},
  {id:'snare',   label:'Snare'},
  {id:'hat',     label:'Hat'},
];

// Built-in MP3/WAV sample instruments (files live in mp3/). Selecting one lazy-loads
// and decodes the file, then plays it pitch-shifted by note like the manual Sample instrument.
const SAMPLE_INSTRUMENTS = [
  // Melodic one-shots
  { id:'smp_kalimba',   label:'Kalimba',           group:'Samples', file:'Single_kalimba_key_p_#1-1779982402422.mp3' },
  { id:'smp_softorgan', label:'Soft Organ',        group:'Samples', file:'Single_long_soft_org_#3-1779982642422.mp3' },
  { id:'smp_church',    label:'Church Organ',      group:'Samples', file:'Deep,_resonant_churc_#4-1779983212494.mp3' },
  { id:'smp_piano',     label:'Soft Piano',        group:'Samples', file:'Deep_soft,piano_note_#1-1779987937345.mp3' },
  { id:'smp_guitar',    label:'Soft Guitar',       group:'Samples', file:'Deep_soft,guitar_key_#4-1780181682186.mp3' },
  { id:'smp_synth',     label:'Soft Synth',        group:'Samples', file:'Deep_soft,synth_key__#3-1780181711331.mp3' },
  { id:'smp_bassdrone', label:'Bass Drone',        group:'Samples', file:'Deep_soft,bass_drone_#3-1779991161590.mp3' },
  { id:'smp_calmpad1',  label:'Calm Pad 1',        group:'Samples', file:'Calm,_beautiful,_sin_#3-1780182182281.mp3' },
  { id:'smp_calmpad2',  label:'Calm Pad 2',        group:'Samples', file:'Calm,_beautiful,_sin_#4-1780182189616.mp3' },

// Build the per-track instrument <select> markup: built-in synths/drums first,
// then grouped <optgroup> submenus for the bundled MP3 sample instruments.
function buildInstrumentOptions(selectedId) {
  const opt = (id, label) =>
    `<option value="${id}" ${id===selectedId?'selected':''}>${escapeHtml(label)}</option>`;
  let html = INSTRUMENTS.map(i => opt(i.id, i.label)).join('');
  const groups = {};
  for (const s of SAMPLE_INSTRUMENTS) (groups[s.group] = groups[s.group] || []).push(s);
  for (const [g, items] of Object.entries(groups)) {
    html += `<optgroup label="${escapeHtml(g)}">` +
            items.map(s => opt(s.id, s.label)).join('') + `</optgroup>`;
  }
  return html;
}

let _idCounter = 0;
function uid() { return 'n' + (++_idCounter) + '_' + Math.random().toString(36).slice(2,6); }

function midiToHz(m)  { return 440 * Math.pow(2, (m - 69) / 12); }
function beatToSec(b) { return b * 60 / project.tempo; }
function secToBeat(s) { return s * project.tempo / 60; }

function delaySyncToBeats(sync) {
  return ({
    '1/16':0.25, '1/8':0.5, '1/8D':0.75,
    '1/4':1, '1/4D':1.5, '1/2':2, '1/1':4
  })[sync] || null;
}
function trackDelayTime(track) {
  const beats = delaySyncToBeats(track.effects?.delaySync);
  return clamp(beats ? beatToSec(beats) : (track.effects?.delayTime ?? 0.375), 0.01, 2.0);
}

function snapBeat(b, q) {
  if (!q) return b;
  return Math.round(b / q) * q;
}
function clamp(v,lo,hi){ return v<lo?lo:v>hi?hi:v; }

function isBlack(m) { return BLACK_NOTES.has(m % 12); }

function noteLabel(m) {
  const names = ['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'];
  return names[m % 12] + (Math.floor(m/12)-1);
}

function lighten(hex, amt) {
  let n = parseInt(hex.slice(1),16);
  let r = clamp(((n>>16)&0xff)+amt,0,255);
  let g = clamp(((n>>8)&0xff)+amt,0,255);
  let b = clamp((n&0xff)+amt,0,255);
  return '#'+[r,g,b].map(x=>x.toString(16).padStart(2,'0')).join('');
}

function roundRect(ctx,x,y,w,h,r){
  r = Math.min(r, w/2, h/2);
  ctx.beginPath();
  ctx.moveTo(x+r,y);
  ctx.lineTo(x+w-r,y); ctx.arcTo(x+w,y,x+w,y+r,r);
  ctx.lineTo(x+w,y+h-r); ctx.arcTo(x+w,y+h,x+w-r,y+h,r);
  ctx.lineTo(x+r,y+h); ctx.arcTo(x,y+h,x,y+h-r,r);
  ctx.lineTo(x,y+r); ctx.arcTo(x,y,x+r,y,r);
  ctx.closePath();
}

function escapeHtml(s) {
  return String(s ?? '').replace(/[&<>"']/g, c =>
    ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c]));
}

function setStatus(msg, isErr) {

// ── DATA MODEL ─────────────────────────────────────────────────────
function makeTrack(overrides={}) {
  const idx = Object.keys(
    project ? (project.sections[activeSectionId]?.tracks||{}) : {}
  ).length;
  const defaultInstruments = INSTRUMENTS.filter(i => !['kick','snare','hat','sample'].includes(i.id));
  return {
    id: uid(),
    label: `Track ${idx+1}`,
    instrument: defaultInstruments[idx % defaultInstruments.length].id,
    color: TRACK_COLORS[idx % TRACK_COLORS.length],
    volume: 0.8,
    muted: false,
    soloed: false,
    reverbSend: 0.2,
    notes: [],
    effects: { ...DEFAULT_FX(), ...(INST_FILTER[overrides.instrument] || {}) },
    ...overrides
  };
}

function makeNote(beatStart, midiNote, duration=0.5, velocity=100) {
  return { id: uid(), beatStart, duration, midiNote, velocity };
}

function makeSection(id) {
  return {
    id, label: id, lengthBars: 2,
    tracks: {},
  };
}

function makeProject(overrides={}) {
  const secA = makeSection('A');
  return {
    version: 2,
    title: 'Untitled',
    tempo: 120,
    sectionOrder: ['A'],
    sections: { A: secA },
    masterFx: DEFAULT_MASTER_FX(),
