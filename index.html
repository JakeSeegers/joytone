function addTrack() {
  pushUndo();
  const t = makeTrack();
  // Add to ALL sections so it's consistent
  for (const sec of Object.values(project.sections)) {
    sec.tracks[t.id] = { ...t, notes: [] };
  }
  // Make sure active section has same id/settings
  project.sections[activeSectionId].tracks[t.id] = t;
  selectedTrackId = t.id;
  if (audioCtx) trackEngines[t.id] = new TrackEngine(t);
  renderTrackHeaders(); PR.dirty=true; schedRedraw(); saveProject();
}

// ── SECTION MANAGEMENT ─────────────────────────────────────────────
function nextSectionId(base='A') {
  const used = new Set(Object.keys(project.sections));
  for (let i=0; i<26; i++) {
    const id = String.fromCharCode(65+i);
    if (!used.has(id)) return id;
  }
  let n = 2;
  while (used.has(base + n)) n++;
  return base + n;
}

function currentPlayingOrderIndex() {
  if (!isPlaying || !project?.sectionOrder?.length) return -1;
  return ((currentSectionPlayIdx % project.sectionOrder.length) + project.sectionOrder.length) % project.sectionOrder.length;
}

function currentPlayingSectionId() {
  const idx = currentPlayingOrderIndex();
  return idx >= 0 ? project.sectionOrder[idx] : null;
}

function updatePlayingSectionHighlight() {
  const playingIdx = currentPlayingOrderIndex();
  const playingId = currentPlayingSectionId();
  document.querySelectorAll('.sec-tab').forEach(el => {
    el.classList.toggle('playing', !!playingId && el.dataset.secId === playingId);
  });
  document.querySelectorAll('.sec-order-item').forEach(el => {
    el.classList.toggle('playing', +el.dataset.oi === playingIdx);
  });
}

function renderSectionUI() {
  // Tabs
  const tabs = document.getElementById('section-tabs');
  tabs.innerHTML = '';
  project.sectionOrder.forEach(id => {
    const sec = project.sections[id];
    if (!sec) return;
    const btn = document.createElement('button');
    btn.className = 'sec-tab' + (id===activeSectionId?' active':'') + (id===currentPlayingSectionId()?' playing':'');
    btn.dataset.secId = id;
    btn.title = `Section ${id} — click to switch`;

    const lbl = document.createElement('span');
    lbl.textContent = sec.label || id;
    btn.appendChild(lbl);

    // × delete button — only show when there's more than one section
    if (project.sectionOrder.length > 1) {
      const del = document.createElement('span');
      del.className = 'sec-del';
      del.textContent = '×';
      del.title = `Delete Section ${id}`;
      del.addEventListener('click', e => { e.stopPropagation(); deleteSection(id); });
      btn.appendChild(del);
    }

    btn.addEventListener('click', () => switchSection(id));
    tabs.appendChild(btn);
  });

  // Play-order display with reorder controls
  const orderDiv = document.getElementById('section-order');
  orderDiv.innerHTML = '';
  project.sectionOrder.forEach((id, i) => {
    if (i > 0) {
      const arrow = document.createElement('span');
      arrow.style.color = '#444';
      arrow.textContent = '→';
      orderDiv.appendChild(arrow);
    }
    const item = document.createElement('span');
    item.className = 'sec-order-item' + (i===currentPlayingOrderIndex()?' playing':'');
    item.dataset.oi = i;
    item.title = `Play-order slot ${i+1}: Section ${id}`;

    const left = document.createElement('button');
    left.className = 'sec-order-move';
    left.textContent = '‹';
    left.title = 'Move section earlier';
    left.disabled = i === 0;
    left.addEventListener('click', e => { e.stopPropagation(); moveSectionOrder(i, i-1); });
    item.appendChild(left);

    const name = document.createElement('span');
    name.className = 'sec-order-name';
    name.textContent = id;
    name.title = `Click to switch to Section ${id}`;
    name.addEventListener('click', () => switchSection(id));
    item.appendChild(name);

    const right = document.createElement('button');
    right.className = 'sec-order-move';
    right.textContent = '›';
    right.title = 'Move section later';
    right.disabled = i === project.sectionOrder.length - 1;
    right.addEventListener('click', e => { e.stopPropagation(); moveSectionOrder(i, i+1); });
    item.appendChild(right);

    if (project.sectionOrder.length > 1) {
      const rm = document.createElement('button');
      rm.className = 'sec-order-remove';
      rm.textContent = '×';
      rm.title = `Remove/delete Section ${id}`;
      rm.addEventListener('click', e => { e.stopPropagation(); deleteSection(id); });
      item.appendChild(rm);
    }

    orderDiv.appendChild(item);
  });
  updatePlayingSectionHighlight();
}

function switchSection(id) {
  if (!project.sections[id]) return;
  activeSectionId = id;
  ensureSelectedTrack();
  if (audioCtx) rebuildEngines();
  renderTrackHeaders();
  renderSectionUI();
  PR.gridDirty = true; PR.dirty = true; schedRedraw();
}

function addSection() {
  const id = nextSectionId();
  pushUndo();
  // Start blank — user will drop MIDIs in independently
  project.sections[id] = makeSection(id);
  project.sectionOrder.push(id);
  switchSection(id);
  saveProject();
}

function moveSectionOrder(fromIdx, toIdx) {
  if (toIdx < 0 || toIdx >= project.sectionOrder.length || fromIdx === toIdx) return;
  pushUndo();
  const [id] = project.sectionOrder.splice(fromIdx, 1);
  project.sectionOrder.splice(toIdx, 0, id);
  renderSectionUI();
  saveProject();
}

function duplicateSection(sourceId = activeSectionId) {
  const src = project.sections[sourceId];
  if (!src) return;
  pushUndo();
  const newId = nextSectionId(sourceId);
  const dup = cloneData(src);
  dup.id = newId;
  dup.label = newId;
  dup.tracks = {};

  for (const [oldTrackId, oldTrack] of Object.entries(src.tracks || {})) {
    const newTrack = cloneData(oldTrack);
    newTrack.id = uid();
    newTrack.notes = (oldTrack.notes || []).map(n => ({ ...cloneData(n), id: uid() }));
    if (newTrack.sample) newTrack.sample = cloneData(newTrack.sample);
    dup.tracks[newTrack.id] = newTrack;
    if (sampleBuffers[oldTrackId]) sampleBuffers[newTrack.id] = sampleBuffers[oldTrackId];
  }

  project.sections[newId] = dup;
  const idx = project.sectionOrder.indexOf(sourceId);
  project.sectionOrder.splice(idx >= 0 ? idx + 1 : project.sectionOrder.length, 0, newId);
  activeSectionId = newId;
  selectedTrackId = Object.keys(dup.tracks)[0] || null;
  if (audioCtx) rebuildEngines();
  renderTrackHeaders();
  renderSectionUI();
  PR.gridDirty = true; PR.dirty = true; schedRedraw();
  saveProject();
  setStatus(`Section ${sourceId} duplicated as ${newId}`);
}

function deleteSection(id) {
  if (project.sectionOrder.length <= 1) return; // must keep at least one
  pushUndo();

  // Remove from order (all occurrences) and from sections map
  project.sectionOrder = project.sectionOrder.filter(s => s !== id);
  for (const tid of Object.keys(project.sections[id]?.tracks || {})) { delete sampleBuffers[tid]; delete xfadeBuffers[tid]; }
  delete project.sections[id];

  // If we just deleted the active section, switch to the first remaining one
  if (activeSectionId === id) {
    activeSectionId = project.sectionOrder[0];
  }
  ensureSelectedTrack();

  if (audioCtx) rebuildEngines();
  renderTrackHeaders();
  renderSectionUI();
  PR.gridDirty = true; PR.dirty = true; schedRedraw();
  saveProject();
  setStatus(`Section ${id} deleted`);
}

// ── MIDI EXPORT ────────────────────────────────────────────────────
function encodeVLQ(v) {
  if (v < 0x80) return [v];
  const b = [v & 0x7F]; v >>= 7;
  while (v > 0) { b.unshift((v & 0x7F) | 0x80); v >>= 7; }
  return b;
}

function buildTempoTrack(bpm) {
  const usPerBeat = Math.round(60000000 / bpm);
  const events = [
    ...encodeVLQ(0), 0xFF, 0x51, 0x03,
    (usPerBeat>>16)&0xFF, (usPerBeat>>8)&0xFF, usPerBeat&0xFF,
    ...encodeVLQ(0), 0xFF, 0x2F, 0x00
  ];
  const len = events.length;
  return [0x4D,0x54,0x72,0x6B, (len>>24)&0xFF,(len>>16)&0xFF,(len>>8)&0xFF,len&0xFF, ...events];
}

function buildNoteTrack(track) {
  const evs = [];
  for (const note of track.notes) {
    evs.push({ tick: Math.round(note.beatStart * PPQ), type:0x90, note:note.midiNote, vel:note.velocity });
    evs.push({ tick: Math.round((note.beatStart+note.duration) * PPQ), type:0x80, note:note.midiNote, vel:0 });
  }
  evs.sort((a,b) => a.tick-b.tick || (a.type===0x80?-1:1));
  const bytes = [];
  let prevTick = 0;
  for (const ev of evs) {
    bytes.push(...encodeVLQ(ev.tick - prevTick));
    bytes.push(ev.type, ev.note, ev.vel);
    prevTick = ev.tick;
  }
  bytes.push(...encodeVLQ(0), 0xFF, 0x2F, 0x00); // end of track
  const len = bytes.length;
  return [0x4D,0x54,0x72,0x6B, (len>>24)&0xFF,(len>>16)&0xFF,(len>>8)&0xFF,len&0xFF, ...bytes];
}

function exportMidi() {
  const section = project.sections[activeSectionId];
  if (!section) return;
  const tracks = Object.values(section.tracks).filter(t=>t.notes.length>0);
  const nTrk = tracks.length + 1; // +1 for tempo track
  const header = [
    0x4D,0x54,0x68,0x64, 0,0,0,6, // MThd length=6
    0,1,                           // format 1
    (nTrk>>8)&0xFF, nTrk&0xFF,    // num tracks
    (PPQ>>8)&0xFF, PPQ&0xFF        // division
  ];
  const chunks = [buildTempoTrack(project.tempo), ...tracks.map(buildNoteTrack)];
  const all = [...header, ...chunks.flat()];
  const blob = new Blob([new Uint8Array(all)], {type:'audio/midi'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = (project.title||'export')+'.mid';
  a.click();
  setStatus('MIDI exported');
}

// ── MIDI IMPORT ────────────────────────────────────────────────────
function readVLQ(view, pos) {
  let val=0, bytes=0;
  while(true){
    const b=view.getUint8(pos+bytes); bytes++;
    val=(val<<7)|(b&0x7F);
    if(!(b&0x80)) break;
  }
  return [val, bytes];
}

function readStr(view, pos, len) {
  let s='';
  for(let i=0;i<len;i++) s+=String.fromCharCode(view.getUint8(pos+i));
  return s;
}

function parseMidi(buf) {
  const view = new DataView(buf);
  if (readStr(view,0,4) !== 'MThd') throw new Error('Not a MIDI file');
  const hdrLen  = view.getUint32(4,false);
  const format  = view.getUint16(8,false);
  const nTracks = view.getUint16(10,false);
  const div     = view.getUint16(12,false);
  const ppq     = (div & 0x8000) ? 480 : div;
  let pos = 8 + hdrLen;

  let tempoMicros = 500000;
  const parsed = [];

  for (let ti=0; ti<nTracks && pos<buf.byteLength; ti++) {
    if (readStr(view,pos,4) !== 'MTrk') break;
    const tLen = view.getUint32(pos+4,false);
    const tEnd = pos+8+tLen;
    pos += 8;
    const evs = []; let absTick=0; let rs=0;
    while (pos < tEnd) {
      const [dt, db] = readVLQ(view,pos); pos+=db; absTick+=dt;
      if (pos>=tEnd) break;
      let sb = view.getUint8(pos);
      if (sb===0xFF) {
        pos++;
        const mt = view.getUint8(pos++);
        const [ml,mb] = readVLQ(view,pos); pos+=mb;
        if (mt===0x51 && ml===3 && ti===0) {
          tempoMicros = (view.getUint8(pos)<<16)|(view.getUint8(pos+1)<<8)|view.getUint8(pos+2);
        }
        pos+=ml;
      } else if (sb===0xF0||sb===0xF7) {
        pos++;
        const [sl,sb2]=readVLQ(view,pos); pos+=sb2+sl;
      } else {
        if (sb&0x80) { rs=sb; pos++; } else { sb=rs; }
        const type=(sb&0xF0)>>4, ch=sb&0x0F;
        if (type===0x9) {
          const n=view.getUint8(pos++), v=view.getUint8(pos++);
          evs.push({tick:absTick, type:v>0?'on':'off', ch, note:n, vel:v});
        } else if (type===0x8) {
          const n=view.getUint8(pos++); pos++;
          evs.push({tick:absTick, type:'off', ch, note:n, vel:0});
        } else if (type===0xA||type===0xB||type===0xE) { pos+=2; }
        else if (type===0xC||type===0xD) { pos+=1; }
      }
    }
    pos = tEnd;
    parsed.push(evs);
  }

  const bpm = Math.round(60000000/tempoMicros);
  return buildProjectFromMidi(parsed, ppq, bpm);
}

// General MIDI drum note → instrument group
// Channel 9 (0-indexed) = GM percussion channel
const GM_DRUMS = {
  35:'kick',  36:'kick',                          // bass drums
  37:'snare', 38:'snare', 39:'snare', 40:'snare', // snare / rim / clap
  41:'snare', 43:'snare', 45:'snare',             // low/mid/high floor toms → snare
  47:'snare', 48:'snare', 50:'snare',             // mid/high toms → snare
  42:'hat',   44:'hat',   46:'hat',               // closed / pedal / open hi-hat
  49:'hat',   51:'hat',   52:'hat',   53:'hat',   // crash / ride / china / ride bell
  54:'hat',   55:'hat',   56:'hat',   57:'hat',   // tambourine / splash / cowbell / crash 2
  58:'hat',   59:'hat',                           // vibraslap / ride 2
};
const GM_DRUM_LABELS = { kick:'Kick', snare:'Snare', hat:'Hi-Hat' };

function buildProjectFromMidi(tracks, ppq, bpm) {
  const proj = makeProject({ tempo: bpm });
  const secA = proj.sections['A'];
  let colorIdx = 0;

  for (const evs of tracks) {
    const open = {};            // `ch_note` → {tick,vel}
    const notesByChannel = {};  // ch → notes[]  (melodic)
    const drumNotes = {};       // 'kick'|'snare'|'hat' → notes[]

    // Pre-scan: decide which channels are drums.
    // A channel is drums if ch===9 OR >70% of its note-ons are GM drum note numbers.
    // This handles packs (like Donit) that put drums on ch 0 with GM note numbers.
    const chTotal = {}, chDrum = {};
    for (const ev of evs) {
      if (ev.type !== 'on' || ev.vel === 0) continue;
      chTotal[ev.ch] = (chTotal[ev.ch] || 0) + 1;
      if (GM_DRUMS[ev.note] !== undefined)
        chDrum[ev.ch] = (chDrum[ev.ch] || 0) + 1;
    }
    const drumChs = new Set(
      Object.keys(chTotal)
        .map(Number)
        .filter(ch => ch === 9 || (chDrum[ch] || 0) / chTotal[ch] > 0.7)
    );

    for (const ev of evs) {
      const key = `${ev.ch}_${ev.note}`;
      if (ev.type==='on') {
        open[key] = {tick:ev.tick, vel:ev.vel};
      } else if (ev.type==='off' && open[key]) {
        const {tick:onTick, vel} = open[key];
        const note = {
          id: uid(),
          beatStart: onTick/ppq,
          duration: Math.max((ev.tick-onTick)/ppq, 0.0625),
          midiNote: ev.note,
          velocity: vel
        };
        if (drumChs.has(ev.ch)) {
          const inst = GM_DRUMS[ev.note] || 'snare';
          if (!drumNotes[inst]) drumNotes[inst] = [];
          drumNotes[inst].push(note);
        } else {
          if (!notesByChannel[ev.ch]) notesByChannel[ev.ch] = [];
          notesByChannel[ev.ch].push(note);
        }
        delete open[key];
      }
    }

    // Melodic tracks — one per MIDI channel
    for (const [ch, notes] of Object.entries(notesByChannel)) {
      if (!notes.length) continue;
      const tid = uid();
      secA.tracks[tid] = {
        id:tid, label:`Ch ${parseInt(ch)+1}`,
        instrument:'piano',
        color: TRACK_COLORS[colorIdx%TRACK_COLORS.length],
        volume:0.8, muted:false, soloed:false, reverbSend:0.2,
        notes, effects:DEFAULT_FX()
      };
      colorIdx++;
    }

    // Drum tracks — one per GM instrument group (kick / snare / hat)
    for (const [inst, notes] of Object.entries(drumNotes)) {
      if (!notes.length) continue;
      const tid = uid();
      secA.tracks[tid] = {
        id:tid, label: GM_DRUM_LABELS[inst] || inst,
        instrument: inst,
        color: TRACK_COLORS[colorIdx%TRACK_COLORS.length],
        volume:0.8, muted:false, soloed:false, reverbSend:0.1,
        notes, effects:{ ...DEFAULT_FX(), ...(INST_FILTER[inst]||{}) }
      };
      colorIdx++;
    }
  }

  // Compute section length
  let maxBeat = 4;
  for (const t of Object.values(secA.tracks))
    for (const n of t.notes)
      maxBeat = Math.max(maxBeat, n.beatStart+n.duration);
  secA.lengthBars = Math.ceil(maxBeat/4);
  return proj;
}

// ── CHORD ROLE EXPANDER ────────────────────────────────────────────
// Group simultaneous notes (within 0.1 beats of each other) into chords.
function groupChords(allNotes) {
  const chords = [];
  for (const note of allNotes) {
    const last = chords[chords.length-1];
    if (last && Math.abs(note.beatStart - last[0].beatStart) < 0.1) last.push(note);
    else chords.push([note]);
  }
  return chords;
}

// Drop a bass note an octave but keep it musical: preserve pitch class, never below C2.
// (The old version floored at C1, which made already-low voicings boomy/muddy.)
function tameBassMidi(low) { let b = low - 12; while (b < 36) b += 12; return b; }

// ── RULE-BASED MELODY GENERATOR ────────────────────────────────────

const SCALE_IVLS = { major:[0,2,4,5,7,9,11], minor:[0,2,3,5,7,8,10] };

// Simplified Krumhansl-Schmuckler: score each possible root against
// the major key profile weighted by note duration.
function detectKeyPc(chords) {
  const PROF = [6.35,2.23,3.48,2.33,4.38,4.09,2.52,5.19,2.39,3.66,2.29,2.88];
  const w = new Array(12).fill(0);
  for (const ch of chords)
    for (const n of ch) w[((n.midiNote%12)+12)%12] += n.duration;
  let best=0, bestS=-Infinity;
  for (let r=0; r<12; r++) {
    let s=0; for (let i=0; i<12; i++) s += w[i]*PROF[(i-r+12)%12];
    if (s>bestS) { bestS=s; best=r; }
  }
  return best; // pitch class 0–11
}

function melScalePool(rootPc, mode, lo, hi) {
  const ivls = SCALE_IVLS[mode]||SCALE_IVLS.major;
  const out=[];
  for (let m=lo; m<=hi; m++) if (ivls.includes(((m-rootPc)%12+12)%12)) out.push(m);
  return out;
}

function melChordPool(chord, lo, hi) {
  const pcs=[...new Set(chord.map(n=>((n.midiNote%12)+12)%12))];
  const out=[];
  for (let m=lo; m<=hi; m++) if (pcs.includes(((m%12)+12)%12)) out.push(m);
  return out;
}

function melWPick(items, weights) {
  let total=weights.reduce((a,b)=>a+b,0), r=Math.random()*total;
  for (let i=0;i<items.length;i++) { r-=weights[i]; if(r<=0) return items[i]; }
  return items[items.length-1];
}

// Rhythm shapes per chord — offsets + durations in beats (assumes 4-beat chord).
// Scaled to actual chord length at generation time.
const MEL_RHYTHMS = [
  [{o:0,d:.9},{o:1,d:.9},{o:2,d:.9},{o:3,d:.9}],              // 4 quarters
  [{o:0,d:.9},{o:1,d:.4},{o:1.5,d:.4},{o:2,d:.9},{o:3,d:.9}], // Q E E Q Q
  [{o:0,d:.9},{o:1,d:.9},{o:2,d:.4},{o:2.5,d:.4},{o:3,d:.9}], // Q Q E E Q
  [{o:0,d:.9},{o:1,d:.9},{o:2,d:.9}],                          // 3 quarters + rest
  [{o:0,d:.4},{o:.5,d:.4},{o:1,d:.9},{o:2,d:.9},{o:3,d:.9}],  // E E Q Q Q
];

function generateMelodyNotes(chords, rootPc, mode='major') {
  const LO=67, HI=86; // G4 – D6: sits above typical chord voicings
  const scale  = melScalePool(rootPc, mode, LO, HI);
  if (!scale.length) return [];

  const notes=[];
  // Start on tonic closest to C5 (midi 72)
  let prev = scale.reduce((b,n)=>Math.abs(n-72)<Math.abs(b-72)?n:b, scale[0]);
  let motif=[];

  for (let ci=0; ci<chords.length; ci++) {
    const chord    = chords[ci];
    const cStart   = chord[0].beatStart;
    const cLen     = ci<chords.length-1
      ? chords[ci+1][0].beatStart - cStart
      : Math.max(chord[0].duration, 2);
    const cTones   = melChordPool(chord, LO, HI);
    const isLast   = ci===chords.length-1;

    // Vary rhythm shape per chord (use chord index + small random offset)
    const shapeIdx = (ci + (Math.random()<.4?1:0)) % MEL_RHYTHMS.length;
    const shape    = MEL_RHYTHMS[shapeIdx];
    const bs       = cLen/4; // beat scale: maps shape's 0-4 range to actual chord length

    for (let ri=0; ri<shape.length; ri++) {
      const {o,d}    = shape[ri];
      const beatStart = cStart + o*bs;
      const duration  = d*bs;
      const strong    = o<0.5 || (o>=2&&o<2.5);
      const phraseEnd = isLast && ri===shape.length-1;

      const pool = (strong||phraseEnd) ? (cTones.length?cTones:scale) : scale;

      const weights = pool.map(n=>{
        const dist=Math.abs(n-prev);
        let w = dist===0?1.5 : dist<=2?5 : dist<=4?3 : dist<=7?1 : 0.2;
        if (ci>=Math.floor(chords.length/2) && motif[ri]!==undefined)
          w += Math.abs(n-motif[ri])<=2 ? 1.5 : 0;
        if (phraseEnd && cTones.includes(n)) w*=4;
        return w;
      });

      let note = melWPick(pool, weights);
      // Clamp leaps > 7 semitones
      if (Math.abs(note-prev)>7 && pool.length>1)
        note = pool.reduce((b,n)=>Math.abs(n-prev)<Math.abs(b-prev)?n:b, pool[0]);

      notes.push({
        id:uid(), beatStart, duration,
        midiNote:note,
        velocity: strong ? 76+Math.floor(Math.random()*16) : 60+Math.floor(Math.random()*14)
      });
      if (motif.length<shape.length) motif.push(note);
      prev=note;
    }
  }
  return notes;
}

// ── GROOVE BASSLINE GENERATOR ──────────────────────────────────────
// Replaces the old "one long note per chord" bass with a rhythmic line
// that locks to kick hits when the section already has a drum track.
//
// kickHits: array of { beatStart } objects from the kick track (may be empty).
// If empty, falls back to a simple repeating quarter-note groove pattern.

function generateBasslineNotes(chords, rootPc, mode='major', kickHits=[]) {
  const LO=33, HI=52; // A1–E3: classic bass guitar range
  const scale = melScalePool(rootPc, mode, LO-2, HI+2);

  // Find best in-range MIDI for a pitch class, staying close to prev
  function inRange(pc, prev) {
    let best=LO, bd=999;
    for (let m=LO; m<=HI; m++) {
      if (((m%12)+12)%12===pc) { const d=Math.abs(m-prev); if(d<bd){bd=d;best=m;} }
    }
    return best;
  }

  // Fallback groove patterns (beat offsets within a 4-beat chord)
  const FALLBACK_PATS = [
    [0,2],               // half-note 2-feel
    [0,1,2,3],           // walking quarters
    [0,2,2.5,3],         // boom + 8th tail
    [0,1,2,2.5],         // active 4
  ];
  let patCell = 0;

  const notes=[];
  const firstChordRootPc = ((chords[0][0].midiNote%12)+12)%12;
  let prev = inRange(firstChordRootPc, 40);

  // Quantize kick hits to 16th-note grid (0.25-beat resolution)
  const kickQ = [...new Set(kickHits.map(h=>Math.round(h.beatStart*4)/4))].sort((a,b)=>a-b);
  const hasKick = kickQ.length > 0;

  for (let ci=0; ci<chords.length; ci++) {
    const chord   = chords[ci];
    const cStart  = chord[0].beatStart;
    const cLen    = ci<chords.length-1
      ? chords[ci+1][0].beatStart - cStart
      : Math.max(chord[0].duration, 2);
    const cEnd    = cStart + cLen;

    const chordRootPc = ((chord[0].midiNote%12)+12)%12;
    const root        = inRange(chordRootPc, prev);
    const fifthPc     = (chordRootPc+7)%12;
    const fifth       = inRange(fifthPc, root);

    // Beat positions: kick hits within this chord, or fallback pattern
    let offsets;
    if (hasKick) {
      offsets = kickQ.filter(b=>b>=cStart && b<cEnd).map(b=>b-cStart);
      if (!offsets.length || offsets[0]>0.25) offsets.unshift(0); // always anchor beat 1
    } else {
      const pat = FALLBACK_PATS[patCell % FALLBACK_PATS.length];
      const bs  = cLen/4;
      offsets = pat.map(p=>p*bs);
      if (ci>0 && ci%4===0) patCell++; // change cell every 4 chords
    }

    // Next chord root for lead-in approach
    const nextRootPc = ci<chords.length-1
      ? ((chords[ci+1][0].midiNote%12)+12)%12
      : chordRootPc;
    const nextRoot = inRange(nextRootPc, root);

    for (let pi=0; pi<offsets.length; pi++) {
      const off  = offsets[pi];
      const beat = (off/(cLen/4));    // 0–4 position within chord
      const strong = beat<0.5 || (beat>=2&&beat<2.5);
      const isLast = pi===offsets.length-1 && ci<chords.length-1;

      let note;
      if (isLast) {
        // Chromatic or scale approach to next chord root (semitone above or below)
        const above = scale.find(n=>n===nextRoot+1||n===nextRoot+2);
        const below = scale.find(n=>n===nextRoot-1||n===nextRoot-2);
        note = (above&&Math.abs(above-prev)<=Math.abs((below||999)-prev)) ? above : (below||root);
      } else if (strong) {
        note = Math.random()<0.72 ? root : fifth;
      } else {
        // Passing tone: scale note closest to prev
        const cands = scale.filter(n=>n>=LO&&n<=HI);
        note = cands.reduce((b,n)=>Math.abs(n-prev)<Math.abs(b-prev)?n:b, root);
      }

      // Duration: to next hit or chord end
      const nextOff = pi<offsets.length-1 ? offsets[pi+1] : cLen;
      const dur     = Math.max(0.12, (nextOff-off)*0.88);

      notes.push({
        id:uid(), beatStart:cStart+off, duration:dur,
        midiNote:note,
        velocity: strong ? 88+Math.floor(Math.random()*18) : 68+Math.floor(Math.random()*16)
      });
      prev=note;
    }
  }
  return notes;
}

// Takes a parsed chord MIDI and returns role tracks. Options let the elemental
// loader pick instruments/reverb per element and turn the arpeggio off/light/full;
// the defaults reproduce the original Library-import arrangement (organ + bass + 16th pluck).
function expandChordRoles(incomingTracks, opts={}) {
  const o = {
    chordInst:'organ', chordVol:0.7, chordReverb:0.35, chordColor:'#ffb74d', chordFx:{ filterCutoff:1200 },
    bass:true,   bassInst:'bass',  bassVol:0.75, bassReverb:0.08, bassColor:'#81c784',
    arp:'full',  arpInst:'pluck',  arpVol:0.45,  arpReverb:0.05,  arpColor:'#ff6b6b',
    melody:true, melodyInst:'bell', melodyVol:0.52, melodyReverb:0.28, melodyColor:'#ce93d8',
    kickHits: [],  // { beatStart } array from the section's kick track — locks bass rhythm to kick
    ...opts
  };

  const allNotes = [];
  for (const t of Object.values(incomingTracks))
    for (const n of t.notes) allNotes.push(n);
  allNotes.sort((a,b) => a.beatStart - b.beatStart || a.midiNote - b.midiNote);
  if (!allNotes.length) return null;

  const chords = groupChords(allNotes);

  // Chord voicing — kept exactly as authored in the source MIDI.
  const chordNotes = allNotes.map(n => ({...n, id:uid()}));

  // Bass — groove line that locks to kick hits when available.
  const bassRootPc = detectKeyPc(chords);
  const bassNotes  = o.bass
    ? generateBasslineNotes(chords, bassRootPc, 'major', o.kickHits)
    : [];

  // Arpeggio — cycling chord tones; 'light' = 8ths, 'full' = 16ths, 'off' = none.
  const arpNotes = [];
  if (o.arp && o.arp !== 'off') {
    const step = o.arp === 'light' ? 0.5 : 0.25;
    for (let i = 0; i < chords.length; i++) {
      const chord  = chords[i];
      const start  = chord[0].beatStart;
      const end    = i < chords.length-1 ? chords[i+1][0].beatStart
                                         : start + chord[0].duration;
      const tones  = [...chord].sort((a,b) => a.midiNote - b.midiNote);
      const pool   = [...tones, ...tones.map(n => ({...n, midiNote: n.midiNote+12}))];
      let beat = start, idx = 0;
      while (beat < end - 0.01) {
        const src = pool[idx % pool.length];
        arpNotes.push({
          id: uid(), beatStart: beat,
          duration: step * 0.85,
          midiNote: src.midiNote,
          velocity: 65 + Math.round(Math.sin(idx * 1.2) * 15 + 15)
        });
        beat += step; idx++;
      }
    }
  }

  const mkTrack = (label, instrument, notes, color, volume, reverbSend, extraFx={}) => ({
    id: uid(), label, instrument, color,
    volume, muted: false, soloed: false, reverbSend,
    notes,
    effects: { ...DEFAULT_FX(), ...(INST_FILTER[instrument]||{}), ...extraFx }
  });

  // Melody — rule-based single voice above the chords
  const melodyNotes = [];
  if (o.melody) {
    const rootPc = detectKeyPc(chords);
    melodyNotes.push(...generateMelodyNotes(chords, rootPc));
  }

  const out = [ mkTrack('Chords', o.chordInst, chordNotes, o.chordColor, o.chordVol, o.chordReverb, o.chordFx||{}) ];
  if (o.bass && bassNotes.length)  out.push(mkTrack('Bass',     o.bassInst,   bassNotes,   o.bassColor,   o.bassVol,   o.bassReverb));
  if (arpNotes.length)             out.push(mkTrack('Arpeggio', o.arpInst,    arpNotes,    o.arpColor,    o.arpVol,    o.arpReverb));
  if (melodyNotes.length)          out.push(mkTrack('Melody',   o.melodyInst, melodyNotes, o.melodyColor, o.melodyVol, o.melodyReverb));
  return out;
}

// Compute what a MIDI import would change (read-only — no mutation yet)
function prepareImport(incomingTracks, targetSectionId) {
  const sec = project.sections[targetSectionId];
  const DRUM_INSTRUMENTS = new Set(['kick','snare','hat']);
  const isDrum = t => DRUM_INSTRUMENTS.has(t.instrument);
  const incomingValues = Object.values(incomingTracks);
  const incomingIsDrum = incomingValues.length > 0 && incomingValues.every(isDrum);

  const savedSettings = {};
  const savedSettingList = [];
  const sampleBufferTransfers = [];
  for (const t of Object.values(sec.tracks)) {
    if (isDrum(t) === incomingIsDrum) {
      const saved = {
        id:t.id, label:t.label, instrument:t.instrument, volume:t.volume,
        muted:t.muted, soloed:t.soloed, reverbSend:t.reverbSend,
        color:t.color, sample:t.sample ? cloneData(t.sample) : null,
        hasSampleBuffer: !!sampleBuffers[t.id],
        effects:{...t.effects}
      };
      savedSettings[t.label] = saved;
      savedSettingList.push(saved);
    }
  }
  const usedSavedSettings = new Set();
  const restore = track => {
    // Prefer exact label matches so Chords/Bass/Arpeggio each keep their own settings.
    // Fallback to a single unmatched sample setting so user-loaded sample tracks survive a new MIDI drop.
    let s = savedSettings[track.label];
    if (!s) {
      const sampleCandidates = savedSettingList.filter(x =>
        !usedSavedSettings.has(x) && (x.instrument === 'sample' || x.sample || x.hasSampleBuffer)
      );
      if (sampleCandidates.length === 1) s = sampleCandidates[0];
    }
    if (!s) return track;
    usedSavedSettings.add(s);
    const restored = { ...track, instrument:s.instrument, volume:s.volume,
      muted:s.muted, soloed:s.soloed, reverbSend:s.reverbSend,
      color:s.color, sample:s.sample ? cloneData(s.sample) : undefined,
      effects:{...DEFAULT_FX(), ...s.effects} };
    if (s.hasSampleBuffer) sampleBufferTransfers.push({ fromId:s.id, toId:restored.id });
    return restored;
  };

  const toDelete = Object.entries(sec.tracks)
    .filter(([,t]) => isDrum(t) === incomingIsDrum).map(([id]) => id);

  let toAdd = [];
  if (!incomingIsDrum) {
    // Collect kick hits from any existing kick tracks in this section so the
    // bass generator can lock its rhythm to the drum groove.
    const kickHits = [];
    for (const t of Object.values(sec.tracks)) {
      if (t.instrument === 'kick') kickHits.push(...t.notes);
    }
    const roles = expandChordRoles(incomingTracks, { kickHits });
    if (roles) toAdd = roles.map(restore);
  } else {
    toAdd = incomingValues.map(restore);
  }

  // Simulate resulting section to compute new length
  const simTracks = { ...sec.tracks };
  for (const id of toDelete) delete simTracks[id];
  for (const t of toAdd) simTracks[t.id] = t;
  let maxBeat = sec.lengthBars * 4;
  for (const t of Object.values(simTracks))
    for (const n of t.notes) maxBeat = Math.max(maxBeat, n.beatStart + n.duration);

  return { toDelete, toAdd, newLengthBars: Math.ceil(maxBeat / 4), sampleBufferTransfers, incomingIsDrum };
}

// Apply a prepared import and refresh UI
function applyImport(prepared, targetSectionId) {
  const sec = project.sections[targetSectionId];
  const buffersToMove = {};
  for (const tr of prepared.sampleBufferTransfers || []) {
    if (sampleBuffers[tr.fromId]) buffersToMove[tr.toId] = sampleBuffers[tr.fromId];
  }
  for (const id of prepared.toDelete) {
    delete sec.tracks[id];
    if (!Object.values(buffersToMove).includes(sampleBuffers[id])) { delete sampleBuffers[id]; delete xfadeBuffers[id]; }
  }
  for (const [id, buf] of Object.entries(buffersToMove)) sampleBuffers[id] = buf;
  for (const t of prepared.toAdd) sec.tracks[t.id] = t;
  sec.lengthBars = prepared.newLengthBars;
  if (!sec.tracks[selectedTrackId] && prepared.toAdd.length) selectedTrackId = prepared.toAdd[0].id;
  ensureSelectedTrack();
  if (audioCtx) rebuildEngines();
  if (prepared.incomingIsDrum) captureLastDrums(sec);  // remember freshly-loaded drums
  renderTrackHeaders(); renderSectionUI();
  PR.gridDirty=true; PR.dirty=true; schedRedraw(); saveProject();
  const n = prepared.toAdd.length;
  setStatus(`Added ${n} track${n!==1?'s':''} to Section ${targetSectionId}`);
}

// Queue or immediately apply a prepared import
function scheduleImport(prepared, targetSectionId) {
  if (isPlaying) {
    pendingMidiSwap = { sectionId: targetSectionId,
      applyFn: () => applyImport(prepared, targetSectionId) };
    setStatus(`Changes queued — takes effect at next loop boundary`);
  } else {
    applyImport(prepared, targetSectionId);
  }
}

function importMidiFile(file) {
  const reader = new FileReader();
  reader.onload = e => {
    try {
      const parsed = parseMidi(e.target.result);
      scheduleImport(prepareImport(parsed.sections['A'].tracks, activeSectionId), activeSectionId);
    } catch(err) { setStatus('MIDI import error: '+err.message, true); }
  };
  reader.readAsArrayBuffer(file);
}

});

// ── WAV BOUNCE ─────────────────────────────────────────────────────
async function bounceWav() {
  const bpm = project.tempo;
  // Calculate total duration
  let totalBars = 0;
  for (const id of project.sectionOrder) totalBars += (project.sections[id]?.lengthBars||2);
  const totalBeats = totalBars * 4;
  const totalSecs  = totalBeats * 60 / bpm + 1.5; // 1.5s tail

  setStatus('Bouncing… this may take a moment');
  // Make sure every built-in sample instrument used anywhere in the song is decoded first.
  for (const secId of project.sectionOrder) {
    for (const track of Object.values(project.sections[secId]?.tracks || {})) {
      if (SAMPLE_INSTRUMENT_BY_ID[track.instrument] && !sampleBuffers[track.id]) {
        await ensureSampleInstrumentLoaded(track);
      }
    }
  }
  const AC = window.OfflineAudioContext || window.webkitOfflineAudioContext;
  const oCtx = new AC(2, Math.ceil(totalSecs * 44100), 44100);

  // Recreate master chain in offline context
  const oNoise = createNoiseBuffer(oCtx);
  const oReverb = oCtx.createConvolver(); oReverb.buffer = buildReverbIR(oCtx, 2);
  const oDelay  = oCtx.createDelay(2); oDelay.delayTime.value = 0.375;
  const oDlyFB  = oCtx.createGain(); oDlyFB.gain.value = 0.35;
  oDelay.connect(oDlyFB); oDlyFB.connect(oDelay);
  const oRvRet  = oCtx.createGain(); oRvRet.gain.value = 0.5; oReverb.connect(oRvRet);
  const oDlRet  = oCtx.createGain(); oDlRet.gain.value = 0.4; oDelay.connect(oDlRet);
  const oComp   = oCtx.createDynamicsCompressor();
  oComp.threshold.value=-18; oComp.ratio.value=6; oComp.knee.value=8;
  const oLim    = oCtx.createDynamicsCompressor();
  oLim.threshold.value=-3; oLim.ratio.value=20; oLim.knee.value=0; oLim.attack.value=0.001; oLim.release.value=0.05;
  const oBus    = oCtx.createGain(); oBus.gain.value = project.masterFx.masterVolume;
  oRvRet.connect(oComp); oDlRet.connect(oComp); oBus.connect(oComp);
  oComp.connect(oLim); oLim.connect(oCtx.destination);

  // Schedule all sections
  let tOffset = 0;
  const savedCtx = audioCtx, savedNoise = noiseBuffer, savedBus = masterBus,
        savedRev = sharedReverb, savedDly = sharedDelay, savedDelayReturn = delayReturn;
  audioCtx = oCtx; noiseBuffer = oNoise; masterBus = oBus;
  sharedReverb = oReverb; sharedDelay = oDelay; delayReturn = oDlRet;

  for (const secId of project.sectionOrder) {
    const sec = project.sections[secId];
    if (!sec) continue;
    const secLenSecs = sec.lengthBars * 4 * 60 / bpm;
    const anySolo = Object.values(sec.tracks).some(t => t.soloed);
    for (const track of Object.values(sec.tracks)) {
      if (track.muted || (anySolo && !track.soloed)) continue;
      track.effects = { ...DEFAULT_FX(), ...(track.effects || {}) };
      const engine = new TrackEngine(track);
      for (const note of track.notes) {
        const t = tOffset + note.beatStart * 60 / bpm;
        playTrackMidiNote(track, note.midiNote, note.duration*60/bpm, t, engine.dest(), note.velocity);
      }
    }
    tOffset += secLenSecs;
  }

  audioCtx = savedCtx; noiseBuffer = savedNoise; masterBus = savedBus;
  sharedReverb = savedRev; sharedDelay = savedDly; delayReturn = savedDelayReturn;

  const rendered = await oCtx.startRendering();
  const blob = audioBufferToWav(rendered);
  const a = document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=(project.title||'bounce')+'.wav'; a.click();
  setStatus('WAV exported');
}

function audioBufferToWav(buf) {
  const nCh=buf.numberOfChannels, sr=buf.sampleRate;
  const chs=[]; for(let i=0;i<nCh;i++) chs.push(buf.getChannelData(i));
  const pcm=new Float32Array(buf.length*nCh);
  for(let i=0;i<buf.length;i++) for(let c=0;c<nCh;c++) pcm[i*nCh+c]=chs[c][i];
  const dataLen=pcm.length*2, ab=new ArrayBuffer(44+dataLen), v=new DataView(ab);
  const ws=(o,s)=>{for(let i=0;i<s.length;i++)v.setUint8(o+i,s.charCodeAt(i));};
  ws(0,'RIFF'); v.setUint32(4,36+dataLen,true); ws(8,'WAVE'); ws(12,'fmt ');
  v.setUint32(16,16,true); v.setUint16(20,1,true); v.setUint16(22,nCh,true);
  v.setUint32(24,sr,true); v.setUint32(28,sr*nCh*2,true); v.setUint16(32,nCh*2,true);
  v.setUint16(34,16,true); ws(36,'data'); v.setUint32(40,dataLen,true);
  let o=44; for(let i=0;i<pcm.length;i++){const s=Math.max(-1,Math.min(1,pcm[i])); v.setInt16(o,s<0?s*0x8000:s*0x7FFF,true); o+=2;}
  return new Blob([ab],{type:'audio/wav'});
}

// ── KEYBOARD SHORTCUTS ─────────────────────────────────────────────
document.addEventListener('keydown', async e => {
  if (e.target.tagName==='INPUT'||e.target.tagName==='SELECT'||e.target.tagName==='TEXTAREA') return;
  if (e.ctrlKey||e.metaKey) {
    if (e.key==='z') { e.preventDefault(); performUndo(); }
    return;
  }
  switch(e.key) {
    case ' ':
      e.preventDefault();
      if (isPlaying) { stopPlayback(); }
      else { await ensureAudio(); if (!audioCtx) break; startPlayback(0); }
      break;
    case 'd': case 'D': setTool('pencil'); break;
    case 's': case 'S': setTool('pointer'); break;
    case 'e': case 'E': setTool('eraser'); break;
    case '+': case '=': zoomIn(); break;
    case '-': case '_': zoomOut(); break;
  }
});

function setTool(name) {
  activeTool = name;
  ['pencil','pointer','eraser'].forEach(t => {
    document.getElementById('tool-'+t).classList.toggle('active', t===name);
  });
  noteCanvas.style.cursor = name==='eraser'?'cell':name==='pointer'?'default':'crosshair';
}

// ── MASTER CONTROLS ────────────────────────────────────────────────
function hissLabel(v) {
  if (v <= 0.001) return 'off';
  if (v <= 0.006) return 'low';
  if (v <= 0.013) return 'mid';
  return 'high';
}

function syncMasterStrip() {
  const fx = project.masterFx;
  document.getElementById('mc-vol').value  = fx.masterVolume;
  document.getElementById('mc-vol-val').textContent = fx.masterVolume.toFixed(2);
  document.getElementById('mc-bass').value = fx.bassGain;
  document.getElementById('mc-bass-val').textContent = (fx.bassGain >= 0 ? '+' : '') + fx.bassGain + ' dB';
  document.getElementById('mc-comp').value = fx.compThreshold;
  document.getElementById('mc-comp-val').textContent = fx.compThreshold;
  document.getElementById('mc-hiss').value = fx.hissLevel;
  document.getElementById('mc-hiss-val').textContent = hissLabel(fx.hissLevel);
}


function applyMasterFxToAudio(timeConstant=0.05) {
  if (!audioCtx || !project?.masterFx) return;
  const fx = project.masterFx;
  const now = audioCtx.currentTime;
  if (masterBus) masterBus.gain.setTargetAtTime(fx.masterVolume, now, timeConstant);
  if (bassBoost) {
    bassBoost.frequency.setTargetAtTime(fx.bassFreq ?? 120, now, timeConstant);
    bassBoost.gain.setTargetAtTime(fx.bassGain ?? 0, now, timeConstant);
  }
  if (compressor) {
    compressor.threshold.setTargetAtTime(fx.compThreshold ?? -18, now, timeConstant);
    compressor.ratio.setTargetAtTime(fx.compRatio ?? 6, now, timeConstant);
  }
  if (hissGainNode && isPlaying) {
    hissGainNode.gain.setTargetAtTime(fx.hissLevel ?? 0, now, Math.max(timeConstant, 0.25));
  }
}

function captureTrackFxSettings(track) {
  return {
    id: track.id,
    label: track.label,
    instrument: track.instrument,
    color: track.color,
    volume: track.volume,
    muted: track.muted,
    soloed: track.soloed,
    reverbSend: track.reverbSend,
    sample: track.sample ? cloneData(track.sample) : null,
    effects: cloneData({ ...DEFAULT_FX(), ...(track.effects || {}) })
  };
}

function captureFxSnapshot(label) {
  const sections = {};
  for (const [secId, sec] of Object.entries(project.sections || {})) {
    sections[secId] = { label: sec.label, tracks: {} };
    for (const [trackId, track] of Object.entries(sec.tracks || {})) {
      sections[secId].tracks[trackId] = captureTrackFxSettings(track);
    }
  }
  return {
    version: 1,
    id: uid(),
    label,
    createdAt: new Date().toISOString(),
    tempo: project.tempo,
    masterFx: cloneData({ ...DEFAULT_MASTER_FX(), ...(project.masterFx || {}) }),
    sections
  };
}

function renderFxSnapshotUI() {
  const wrap = document.getElementById('fx-state-buttons');
  if (!wrap) return;
  wrap.innerHTML = '';
  fxSnapshots.forEach((snap, i) => {
    if (!snap.label) snap.label = `FX ${i+1}`;
    const btn = document.createElement('button');
    btn.className = 'fx-state-btn';
    btn.textContent = snap.label;
    btn.title = `${snap.label}: crossfade to this saved master/per-track FX state.`;
    btn.addEventListener('click', () => recallFxSnapshot(i));
    wrap.appendChild(btn);
  });
}

function saveFxStateButton() {
  const label = `FX ${fxSnapshots.length + 1}`;
  fxSnapshots.push(captureFxSnapshot(label));
  renderFxSnapshotUI();
  saveProject();
  setStatus(`${label} saved — master and per-track settings captured`);
}

function normalizeFxSnapshot(snap, i=0) {
  const out = cloneData(snap || {});
  out.version = out.version || 1;
  out.id = out.id || uid();
  out.label = out.label || `FX ${i+1}`;
  out.masterFx = { ...DEFAULT_MASTER_FX(), ...(out.masterFx || {}) };
  out.sections = out.sections || {};
  for (const sec of Object.values(out.sections)) {
    sec.tracks = sec.tracks || {};
    for (const tr of Object.values(sec.tracks)) {
      tr.effects = { ...DEFAULT_FX(), ...(tr.effects || {}) };
    }
  }
  return out;
}

function downloadFxStates() {
  if (!fxSnapshots.length) {
    setStatus('No FX states saved yet — click + Save State first', true);
    return;
  }
  const payload = {
    type: 'daw-fx-state-bank',
    version: 1,
    exportedAt: new Date().toISOString(),
    projectTitle: project.title || 'Untitled',
    snapshots: fxSnapshots.map(normalizeFxSnapshot)
  };
  const blob = new Blob([JSON.stringify(payload, null, 2)], { type:'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = (project.title || 'daw') + '-fx-states.json';
  a.click();
  URL.revokeObjectURL(a.href);
  setStatus('FX state bank downloaded');
}

function uploadFxStatesFile(file) {
  const reader = new FileReader();
  reader.onload = e => {
    try {
      const data = JSON.parse(e.target.result);
      const snaps = Array.isArray(data) ? data : data.snapshots;
      if (!Array.isArray(snaps)) throw new Error('No snapshots array found');
      if (fxSnapshots.length && !confirm('Replace the current FX state buttons with the uploaded set?')) return;
      fxSnapshots = snaps.map((s, i) => normalizeFxSnapshot(s, i));
      renderFxSnapshotUI();
      saveProject();
      setStatus(`Loaded ${fxSnapshots.length} FX state${fxSnapshots.length!==1?'s':''}`);
    } catch(err) {
      setStatus('FX state upload error: ' + err.message, true);
    }
  };
  reader.readAsText(file);
}

function findTrackForSnapshot(secId, trackId, savedTrack) {
  const sec = project.sections[secId];
  if (!sec) return null;
  if (sec.tracks[trackId]) return sec.tracks[trackId];
  // Fallback helps if a bank is loaded after track IDs changed, while still keeping tracks distinct.
  return Object.values(sec.tracks).find(t => t.label === savedTrack.label && t.instrument === savedTrack.instrument)
      || Object.values(sec.tracks).find(t => t.label === savedTrack.label)
      || null;
}

function lerp(a, b, t) { return a + (b - a) * t; }
function num(v, fallback=0) { return Number.isFinite(+v) ? +v : fallback; }

function recallFxSnapshot(index, duration=1.5) {
  const snap = normalizeFxSnapshot(fxSnapshots[index], index);
  if (!snap) return;
  pushUndo();
  fxMorphSerial++;
  const serial = fxMorphSerial;
  document.querySelectorAll('.fx-state-btn').forEach((b, i) => b.classList.toggle('morphing', i === index));

  const startMaster = cloneData({ ...DEFAULT_MASTER_FX(), ...(project.masterFx || {}) });
  const targetMaster = cloneData({ ...DEFAULT_MASTER_FX(), ...(snap.masterFx || {}) });
  const trackPairs = [];

  for (const [secId, secSnap] of Object.entries(snap.sections || {})) {
    for (const [trackId, savedTrackRaw] of Object.entries(secSnap.tracks || {})) {
      const savedTrack = normalizeFxSnapshot({ sections:{ tmp:{ tracks:{ tmp:savedTrackRaw } } } }).sections.tmp.tracks.tmp;
      const track = findTrackForSnapshot(secId, trackId, savedTrack);
      if (!track) continue;
      track.effects = { ...DEFAULT_FX(), ...(track.effects || {}) };
      trackPairs.push({
        secId,
        track,
        start: captureTrackFxSettings(track),
        target: savedTrack
      });
      // String-valued FX need to switch discretely. Do it at the start so numeric params morph toward the right mode.
      track.effects.filterType = savedTrack.effects.filterType || track.effects.filterType;
      track.effects.delaySync = savedTrack.effects.delaySync || track.effects.delaySync;
    }
  }

  const numericTrackKeys = ['volume','reverbSend'];
  const numericFxKeys = Object.keys(DEFAULT_FX()).filter(k => typeof DEFAULT_FX()[k] === 'number');
  const numericMasterKeys = Object.keys(DEFAULT_MASTER_FX()).filter(k => typeof DEFAULT_MASTER_FX()[k] === 'number');
  const t0 = performance.now();
  setStatus(`Crossfading to ${snap.label}…`);

  function step(now) {
    if (serial !== fxMorphSerial) return;
    const raw = duration <= 0 ? 1 : Math.min(1, (now - t0) / (duration * 1000));
    const p = raw * raw * (3 - 2 * raw); // smoothstep

    for (const k of numericMasterKeys) {
      project.masterFx[k] = lerp(num(startMaster[k], DEFAULT_MASTER_FX()[k]), num(targetMaster[k], DEFAULT_MASTER_FX()[k]), p);
    }
    applyMasterFxToAudio(0.08);

    for (const pair of trackPairs) {
      const { track, start, target } = pair;
      for (const k of numericTrackKeys) {
        track[k] = lerp(num(start[k], 0), num(target[k], start[k]), p);
      }
      track.effects = track.effects || {};
      for (const k of numericFxKeys) {
        const fallback = DEFAULT_FX()[k];
        track.effects[k] = lerp(num(start.effects?.[k], fallback), num(target.effects?.[k], fallback), p);
      }
    }

    Object.values(activeTracks()).forEach(t => trackEngines[t.id]?.apply(t));
    if (raw < 1) {
      requestAnimationFrame(step);
    } else {
      finishFxSnapshotRecall(serial, snap, trackPairs, targetMaster);
    }
  }
  requestAnimationFrame(step);
}

function finishFxSnapshotRecall(serial, snap, trackPairs, targetMaster) {
  if (serial !== fxMorphSerial) return;
  project.masterFx = { ...DEFAULT_MASTER_FX(), ...targetMaster };
  project.tempo = clamp(+snap.tempo || project.tempo, 20, 400);
  document.getElementById('bpm-input').value = project.tempo;

  for (const { track, target } of trackPairs) {
    track.instrument = target.instrument || track.instrument;
    track.color = target.color || track.color;
    track.volume = num(target.volume, track.volume);
    track.muted = !!target.muted;
    track.soloed = !!target.soloed;
    track.reverbSend = num(target.reverbSend, track.reverbSend);
    track.sample = target.sample ? cloneData(target.sample) : track.sample;
    track.effects = { ...DEFAULT_FX(), ...(target.effects || {}) };
  }

  applyMasterFxToAudio(0.05);
  Object.values(activeTracks()).forEach(t => trackEngines[t.id]?.apply(t));
  syncMasterStrip();
  renderTrackHeaders();
  renderFxSnapshotUI();
  PR.dirty = true; schedRedraw();
  saveProject();
  setStatus(`${snap.label} loaded`);
}

// ── MIDI LIBRARY BROWSER ──────────────────────────────────────────
let manifestCache = null;
let libDeck = 'chords'; // 'chords' | 'drums'

async function loadManifest() {
  if (manifestCache) return manifestCache;
  const r = await fetch('midi-manifest.json');
  if (!r.ok) throw new Error('Could not load midi-manifest.json');
  manifestCache = (await r.json()).map(e => ({
    ...e,
    moods: Array.isArray(e.moods) ? e.moods : (e.moods ? [e.moods] : [])
  }));
  return manifestCache;
}

async function importMidiFromUrl(path) {
  try {
    const r = await fetch(path);
    if (!r.ok) throw new Error('Failed to fetch ' + path);
    const buf = await r.arrayBuffer();
    const parsed = parseMidi(buf);
    scheduleImport(prepareImport(parsed.sections['A'].tracks, activeSectionId), activeSectionId);
  } catch(err) { setStatus('Library import error: '+err.message, true); }
}

function renderLibraryFilters() {
  const f = document.getElementById('lib-filters');
  if (libDeck === 'chords') {
    f.innerHTML = `
      <select id="lf-category">
        <option value="">All categories</option>
        <option>Major</option><option>Minor</option><option>Modal</option>
      </select>
      <select id="lf-key">
        <option value="">Any key</option>
        ${['A','Bb','B','C','C#','D','Eb','E','F','F#','G','Ab']
          .map(k=>`<option>${k}</option>`).join('')}
      </select>
      <input id="lf-mood" type="text" placeholder="Search mood / progression…">`;
  } else {
    f.innerHTML = `
      <select id="lf-feel">
        <option value="">All feels</option>
        <option value="4otf">4 On The Floor</option>
        <option value="groovy">Groovy</option>
        <option value="halftime">Half-time</option>
        <option value="percussion">Percussion</option>
      </select>
      <select id="lf-genre">
        <option value="">Any genre</option>
        ${['House','Funk','HipHop','Jazz','Rock','Soul','Afro','Latin','RnB','Pop','Trap']
          .map(g=>`<option>${g}</option>`).join('')}
      </select>`;
  }
  f.querySelectorAll('select,input').forEach(el =>
    el.addEventListener('input', renderLibraryList));
}

function renderLibraryList() {
  if (!manifestCache) return;
  const list = document.getElementById('lib-list');
  const status = document.getElementById('lib-status');

  let entries = manifestCache.filter(e => e.deck === libDeck);

  if (libDeck === 'chords') {
    const cat  = document.getElementById('lf-category')?.value || '';
    const key  = document.getElementById('lf-key')?.value || '';
    const mood = (document.getElementById('lf-mood')?.value || '').toLowerCase();
    if (cat)  entries = entries.filter(e => e.category === cat);
    if (key)  entries = entries.filter(e => e.key === key);
    if (mood) entries = entries.filter(e =>
      (e.moods||[]).some(m => m.toLowerCase().includes(mood)) ||
      (e.progression||'').toLowerCase().includes(mood));
  } else {
    const feel  = document.getElementById('lf-feel')?.value || '';
    const genre = (document.getElementById('lf-genre')?.value || '').toLowerCase();
    if (feel)  entries = entries.filter(e => e.feel === feel);
    if (genre) entries = entries.filter(e => (e.genre||'').toLowerCase() === genre);
  }

  status.textContent = `${entries.length} file${entries.length!==1?'s':''} found`;
  const show = entries.slice(0, 200);
  list.innerHTML = show.map(e => {
    const title = libDeck === 'chords'
      ? `${e.key} · ${e.progression}`
      : `${e.genre} ${e.feel} #${e.index}`;
    const meta = libDeck === 'chords'
      ? `${e.category} · ${(e.moods||[]).join(', ')}`
      : `${e.feel}${e.density?' · '+e.density:''}`;
    return `<div class="lib-row">
      <div class="lib-row-info">
        <div class="lib-row-title">${title}</div>
        <div class="lib-row-meta">${meta}</div>
      </div>
      <button class="lib-row-load" data-path="${e.path}">Load</button>
    </div>`;
  }).join('');
  if (entries.length > 200) {
    list.innerHTML += `<div style="padding:8px 14px;font-size:11px;color:#666">
      Showing 200 of ${entries.length} — use filters to narrow down</div>`;
  }
  list.querySelectorAll('.lib-row-load').forEach(btn =>
    btn.addEventListener('click', async () => {
      const path = btn.dataset.path;
      document.getElementById('lib-modal').classList.remove('open');
      setStatus('Loading from library…');
      await importMidiFromUrl(path);
    }));
}

async function openLibrary() {
  document.getElementById('lib-modal').classList.add('open');
  renderLibraryFilters();
  if (!manifestCache) {
    document.getElementById('lib-list').innerHTML = '';
    document.getElementById('lib-status').textContent = 'Loading library…';
    try { await loadManifest(); }
    catch(e) {
      document.getElementById('lib-status').textContent = 'Error: ' + e.message;
      return;
    }
  }
  renderLibraryList();
}

document.getElementById('btn-library').addEventListener('click', openLibrary);
document.getElementById('lib-close').addEventListener('click', () =>

document.getElementById('lib-modal').addEventListener('click', e => {

document.getElementById('lib-tabs').addEventListener('click', e => {

  libDeck = tab.dataset.deck;
  document.querySelectorAll('.lib-tab').forEach(t => t.classList.toggle('active', t === tab));
  renderLibraryFilters();

});

// Per-element voicing/instrument profile feeding expandChordRoles().
const ELEMENT_ORDER = ['Earth','Water','Fire','Wind','Void'];
const ELEMENT_PROFILE = {
  Earth: { chordInst:'organ', chordReverb:0.18, color:'#ffd54f', arp:'off',   icon:'🜃' },
  Water: { chordInst:'flute', chordReverb:0.32, color:'#4fc3f7', arp:'off',   icon:'🜄' },
  Fire:  { chordInst:'synth', chordReverb:0.12, color:'#ff6b6b', arp:'full',  arpInst:'pluck',   icon:'🜂' },
  Wind:  { chordInst:'bell',  chordReverb:0.36, color:'#aed581', arp:'light', arpInst:'marimba', icon:'🜁' },
  Void:  { chordInst:'synth', chordReverb:0.52, color:'#ba68c8', arp:'off',   chordVol:0.6, icon:'◯' },
};
const ARP_RANK = { off:0, light:1, full:2 };

// Merge one or two element profiles into expandChordRoles options.
function profileFor(elements) {
  const ps = elements.map(e => ELEMENT_PROFILE[e]).filter(Boolean);
  if (!ps.length) return {};
  const p0 = ps[0];
  let arp = 'off';
  for (const p of ps) if (ARP_RANK[p.arp||'off'] > ARP_RANK[arp]) arp = p.arp || 'off';
  const arpProvider = ps.find(p => (p.arp||'off') === arp && p.arpInst) || p0;
  return {
    chordInst: p0.chordInst,
    chordVol:  p0.chordVol || 0.7,
    chordReverb: Math.max(...ps.map(p => p.chordReverb || 0)),
    chordColor: p0.color,
    chordFx: {},
    bass: true,
    arp,
    arpInst: arpProvider.arpInst || 'pluck',
  };
}

let elementalFilter = 'Any';
let elementalAuto = false;
let elementalCurrent = null;

function elementalPool(filter) {
  return filter === 'Any' ? ELEMENTAL_CHORDS : ELEMENTAL_CHORDS.filter(c => c.e.includes(filter));
}
function pickRandomElemental(filter, exclude) {
  const pool = elementalPool(filter);
  const choices = pool.length > 1 ? pool.filter(c => c !== exclude) : pool;
  return choices[Math.floor(Math.random() * choices.length)] || null;
}

async function fetchElementalRoles(entry) {
  const r = await fetch(encodeURI(entry.p));
  if (!r.ok) throw new Error('HTTP ' + r.status);
  const parsed = parseMidi(await r.arrayBuffer());
  const roles = expandChordRoles(parsed.sections['A'].tracks, profileFor(entry.e));
  if (!roles) throw new Error('empty MIDI');
  return roles;
}

// Replace the active section's tracks with a freshly-built elemental arrangement.
function applyElementalRoles(roles, entry) {
  const sec = project.sections[activeSectionId];
  captureLastDrums(sec);  // remember any drums before they're replaced
  for (const id of Object.keys(sec.tracks)) {
    trackEngines[id]?.destroy(); delete trackEngines[id];
    delete sampleBuffers[id]; delete xfadeBuffers[id]; delete sec.tracks[id];
  }
  let maxBeat = 4;
  for (const t of roles) { sec.tracks[t.id] = t; for (const n of t.notes) maxBeat = Math.max(maxBeat, n.beatStart + n.duration); }
  sec.lengthBars = Math.max(1, Math.ceil(maxBeat / 4));
  selectedTrackId = roles[0]?.id || null;
  if (audioCtx) rebuildEngines();
  renderTrackHeaders(); renderSectionUI();
  PR.gridDirty = true; PR.dirty = true; schedRedraw(); saveProject();
}

// Prefetch the next random clip and queue it to swap in at the next loop boundary.
async function queueNextElemental() {
  const next = pickRandomElemental(elementalFilter, elementalCurrent);
  if (!next) return;
  let roles = null;
  try { roles = await fetchElementalRoles(next); } catch(e) { /* skip a beat on error */ }
  pendingMidiSwap = {
    sectionId: activeSectionId,
    applyFn: () => {
      if (roles) { elementalCurrent = next; applyElementalRoles(roles, next); setStatus('Elemental: ' + next.n); updateElementalUI(); }
      if (elementalAuto && isPlaying) queueNextElemental();
    }
  };
}

// Element button (or "Any") → load a random matching clip and loop it.
async function startElemental(filter) {
  await ensureAudio();
  if (!audioCtx) return;
  elementalFilter = filter;
  const entry = pickRandomElemental(filter, null);
  if (!entry) { setStatus('No clips for ' + filter, true); return; }
  let roles;
  try { roles = await fetchElementalRoles(entry); }
  catch(e) { setStatus('Elemental load error: ' + e.message, true); return; }
  elementalCurrent = entry;
  applyElementalRoles(roles, entry);
  setStatus('Elemental: ' + entry.n);
  if (!isPlaying) startPlayback(0);
  updateElementalUI();
  if (elementalAuto) queueNextElemental();
}

function toggleElementalAuto() {
  elementalAuto = !elementalAuto;
  updateElementalUI();
  if (elementalAuto && isPlaying && elementalCurrent) queueNextElemental();
  else if (!elementalAuto && pendingMidiSwap) pendingMidiSwap = null; // stop shuffling; current clip keeps looping
  setStatus(elementalAuto ? 'Elemental auto-shuffle ON' : 'Elemental auto-shuffle off');
}

function buildElementalUI() {
  const wrap = document.getElementById('elemental-buttons');
  if (!wrap) return;
  wrap.innerHTML = '';
  ELEMENT_ORDER.forEach(el => {
    const b = document.createElement('button');
    b.className = 'el-btn'; b.dataset.el = el;
    b.textContent = ELEMENT_PROFILE[el].icon + ' ' + el;
    b.style.borderColor = ELEMENT_PROFILE[el].color;
    b.title = `Load & loop a random ${el} chord progression`;
    b.addEventListener('click', () => startElemental(el));
    wrap.appendChild(b);
  });
  const any = document.createElement('button');
  any.className = 'el-btn'; any.dataset.el = 'Any'; any.textContent = '✦ Any';
  any.title = 'Load & loop a random clip from all 35';
  any.addEventListener('click', () => startElemental('Any'));
  wrap.appendChild(any);
}

function updateElementalUI() {
  document.querySelectorAll('.el-btn').forEach(b =>
    b.classList.toggle('active', b.dataset.el === elementalFilter && !!elementalCurrent));
  const auto = document.getElementById('btn-elemental-auto');
  if (auto) auto.classList.toggle('on', elementalAuto);
}

// ── LAST DRUMS ─────────────────────────────────────────────────────
// Remembers the most-recent drum tracks (with their mix/FX) so they can be
// re-dropped onto a new sequence — e.g. after an elemental clip wipes the section.
let lastDrums = null;  // [{ track:<clone>, buffer:<AudioBuffer|null> }]

function isDrumTrack(t) {
  if (['kick','snare','hat'].includes(t.instrument)) return true;
  const def = SAMPLE_INSTRUMENT_BY_ID[t.instrument];
  return !!def && (def.group === 'Kicks' || def.group === 'Percussion');
}

// Snapshot the drum tracks currently in a section, preserving their settings.
function captureLastDrums(sec) {
  if (!sec) return;
  const drums = Object.values(sec.tracks).filter(isDrumTrack);
  if (!drums.length) return;
  lastDrums = drums.map(t => ({ track: cloneData(t), buffer: sampleBuffers[t.id] || null }));
  updateAddDrumsButton();
}

// Re-add the remembered drums to the active section with their previous settings.
// Replaces any drum tracks already present (so repeated presses don't stack).
function addLastDrums() {
  if (!lastDrums || !lastDrums.length) { setStatus('No drums loaded yet to add', true); return; }
  pushUndo();
  const sec = project.sections[activeSectionId];
  for (const t of Object.values(sec.tracks)) {
    if (isDrumTrack(t)) {
      trackEngines[t.id]?.destroy(); delete trackEngines[t.id];
      delete sampleBuffers[t.id]; delete xfadeBuffers[t.id]; delete sec.tracks[t.id];
    }
  }
  for (const { track, buffer } of lastDrums) {
    const nt = cloneData(track);
    nt.id = uid();
    nt.notes = (track.notes || []).map(n => ({ ...cloneData(n), id: uid() }));
    sec.tracks[nt.id] = nt;
    if (buffer) sampleBuffers[nt.id] = buffer;
  }
  if (audioCtx) rebuildEngines();
  renderTrackHeaders(); renderSectionUI();
  PR.gridDirty = true; PR.dirty = true; schedRedraw(); saveProject();
  setStatus(`Added last drums (${lastDrums.length} track${lastDrums.length!==1?'s':''})`);
}

function updateAddDrumsButton() {
  const btn = document.getElementById('btn-add-drums');
  if (btn) btn.disabled = !(lastDrums && lastDrums.length);
}

// ── TRANSPORT WIRING ───────────────────────────────────────────────
document.getElementById('btn-play').addEventListener('click', async () => {
  await ensureAudio();
  if (isPlaying) stopPlayback();
  else startPlayback(0);
});
document.getElementById('btn-stop').addEventListener('click', () => {
  stopPlayback();
  playStartBeat = 0;
  document.getElementById('playhead-time').textContent = '0:00';
  PR.dirty = true; schedRedraw();
});
document.getElementById('bpm-input').addEventListener('input', e => {
  project.tempo = clamp(+e.target.value||120, 20, 400);
  Object.values(activeTracks()).forEach(t => trackEngines[t.id]?.apply(t));
  saveProject();
});
document.getElementById('quant-sel').addEventListener('change', e => {
  quantSnap = +e.target.value;
});
document.getElementById('btn-undo').addEventListener('click', performUndo);
document.getElementById('btn-export-midi').addEventListener('click', async () => { await ensureAudio(); exportMidi(); });
document.getElementById('btn-import-midi').addEventListener('click', () => document.getElementById('midi-file-input').click());
document.getElementById('midi-file-input').addEventListener('change', e => { if(e.target.files[0]) importMidiFile(e.target.files[0]); e.target.value=''; });
document.getElementById('btn-export-wav').addEventListener('click', async () => { await ensureAudio(); bounceWav(); });
document.getElementById('btn-load-demo').addEventListener('click', loadDemo);
document.getElementById('btn-reset').addEventListener('click', () => {
  if (confirm('Clear all saved state and start with a blank project?')) {
    localStorage.removeItem('daw-v2');
    project = makeProject();
    activeSectionId = 'A';
    selectedTrackId = null;
    fxSnapshots = [];
    renderFxSnapshotUI();
    ensureSelectedTrack();
    if (audioCtx) rebuildEngines();
    renderTrackHeaders();
    renderSectionUI();
    syncMasterStrip();
    PR.scrollBeat=0; PR.gridDirty=true; PR.dirty=true; schedRedraw();
    setStatus('Reset — blank project');
  }
});
document.getElementById('btn-add-track').addEventListener('click', async () => { await ensureAudio(); addTrack(); });
document.getElementById('btn-add-section').addEventListener('click', addSection);
document.getElementById('btn-dup-section').addEventListener('click', () => duplicateSection(activeSectionId));
document.getElementById('btn-elemental-auto').addEventListener('click', toggleElementalAuto);
document.getElementById('btn-add-drums').addEventListener('click', addLastDrums);

// ── INIT ───────────────────────────────────────────────────────────
function init() {
  if (!loadSaved()) {
    project = makeProject();
    activeSectionId = 'A';
    selectedTrackId = null;
    normalizeProjectData();
    ensureSelectedTrack();
  }
  document.getElementById('bpm-input').value = project.tempo;
  syncMasterStrip();

  renderTrackHeaders();
  renderSectionUI();
  renderFxSnapshotUI();
  buildElementalUI();
  updateAddDrumsButton();

  // Initial piano roll scroll — center on MIDI ~60-72 range
  window.addEventListener('resize', () => { PR.gridDirty=true; PR.dirty=true; schedRedraw(); });
  // Wait a frame so layout is computed
  requestAnimationFrame(() => {
    resizeCanvases();
    PR.scrollPitchPx = Math.max(0, (MIDI_MAX - 80) * PR.rowHeight - (PR.height - RULER_H) * 0.35);
    PR.gridDirty=true; PR.dirty=true; schedRedraw();
  });
}

init();
</script>
